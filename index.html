<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradingView Pro - Full Screen Chart with Live Countdown</title>
  
  <!-- Lightweight Charts Official Library -->
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b0e14;
      color: #d1d4dc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOP HEADER & CONTROLS */
    .tv-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #131722;
      border-bottom: 1px solid #2a2e39;
      padding: 10px 16px;
      height: 55px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-weight: 800;
      font-size: 15px;
      color: #2962ff;
      letter-spacing: 0.5px;
    }

    .select-dropdown, .tf-btn {
      background-color: #1e222d;
      color: #d1d4dc;
      border: 1px solid #2a2e39;
      padding: 7px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .select-dropdown:hover, .tf-btn:hover {
      border-color: #2962ff;
    }

    .tf-btn.active {
      background-color: #2962ff;
      color: #ffffff;
      border-color: #2962ff;
    }

    /* CANDLE TIMEFRAME COUNTDOWN TIMER DISPLAY */
    .countdown-badge {
      background: #1e222d;
      border: 1px solid #2a2e39;
      padding: 6px 12px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      color: #ff9800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* FULL SCREEN CHART WRAPPER */
    .chart-container-wrapper {
      flex: 1;
      width: 100%;
      height: calc(100vh - 55px);
      position: relative;
      background-color: #131722;
    }

    #tv-chart {
      width: 100%;
      height: 100%;
    }

    /* FLOATING WATERMARK ON CHART */
    .chart-watermark {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      pointer-events: none;
      font-family: monospace;
      background: rgba(19, 23, 34, 0.75);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #2a2e39;
    }

    .wm-symbol { font-size: 16px; font-weight: bold; color: #ffffff; }
    .wm-price { font-size: 14px; font-weight: bold; color: #26a69a; }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="tv-header">
    <div class="nav-group">
      <div class="brand-title">📈 TRADINGVIEW FULL CHART</div>
      
      <!-- Symbol Selector -->
      <select id="symbolSelect" class="select-dropdown" onchange="changeSymbol(this.value)">
        <option value="BTCUSDT" selected>BTC/USDT</option>
        <option value="ETHUSDT">ETH/USDT</option>
        <option value="SOLUSDT">SOL/USDT</option>
        <option value="BNBUSDT">BNB/USDT</option>
        <option value="DOGEUSDT">DOGE/USDT</option>
      </select>

      <!-- Timeframe Selector -->
      <div style="display: flex; gap: 4px;" id="tfGroup">
        <button class="tf-btn" onclick="changeTimeframe('1m', this)">1m</button>
        <button class="tf-btn active" onclick="changeTimeframe('5m', this)">5m</button>
        <button class="tf-btn" onclick="changeTimeframe('15m', this)">15m</button>
        <button class="tf-btn" onclick="changeTimeframe('1h', this)">1h</button>
        <button class="tf-btn" onclick="changeTimeframe('4h', this)">4h</button>
        <button class="tf-btn" onclick="changeTimeframe('1d', this)">1D</button>
      </div>
    </div>

    <div class="nav-group">
      <!-- Live Candle Countdown Timer -->
      <div class="countdown-badge">
        <span>⏳ Candle Close in:</span>
        <span id="candleTimer">--:--</span>
      </div>
    </div>
  </div>

  <!-- FULL SCREEN CHART AREA -->
  <div class="chart-container-wrapper">
    <div class="chart-watermark">
      <div class="wm-symbol" id="wmSymbol">BTCUSDT</div>
      <div class="wm-price" id="wmPrice">$0.00</div>
    </div>
    <div id="tv-chart"></div>
  </div>

  <!-- SCRIPT ENGINE -->
  <script>
    let chart, candleSeries, stSeries;
    let ws = null;
    let currentSymbol = localStorage.getItem('tv_full_symbol') || 'BTCUSDT';
    let currentTimeframe = localStorage.getItem('tv_full_tf') || '5m';
    let rawCandles = [];
    let currentCandleCloseTime = 0;
    let timerInterval = null;

    document.getElementById('symbolSelect').value = currentSymbol;

    // Highlight active timeframe button on load
    document.querySelectorAll('#tfGroup button').forEach(btn => {
      if (btn.innerText.toLowerCase() === currentTimeframe.toLowerCase()) {
        document.querySelectorAll('#tfGroup button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
    });

    function initChart() {
      const container = document.getElementById('tv-chart');
      
      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        priceScale: { borderColor: '#2a2e39' },
        timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: true }
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderUpColor: '#26a69a', borderDownColor: '#ef5350',
        wickUpColor: '#26a69a', wickDownColor: '#ef5350'
      });

      stSeries = chart.addLineSeries({ color: '#2962ff', lineWidth: 2, crosshairMarkerVisible: false });

      window.addEventListener('resize', () => {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      });

      loadHistoryData();
    }

    async function loadHistoryData() {
      try {
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${currentSymbol}&interval=${currentTimeframe}&limit=350`);
        const data = await res.json();

        rawCandles = data.map(d => ({
          time: Math.floor(d[0] / 1000),
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4])
        }));

        candleSeries.setData(rawCandles);
        plotSupertrend();
        
        if (rawCandles.length > 0) {
          const lastC = rawCandles[rawCandles.length - 1];
          // Determine timeframe duration in seconds
          const tfSecs = getTimeframeSeconds(currentTimeframe);
          currentCandleCloseTime = lastC.time + tfSecs;
          startCountdownTimer();
        }

        connectLiveWebSocket();
      } catch (err) {
        console.error("Failed to load historical candles:", err);
      }
    }

    function getTimeframeSeconds(tf) {
      if (tf.endsWith('m')) return parseInt(tf) * 60;
      if (tf.endsWith('h')) return parseInt(tf) * 3600;
      if (tf.endsWith('d') || tf.endsWith('D')) return 86400;
      return 300; // default 5m
    }

    function plotSupertrend() {
      if (rawCandles.length === 0) return;
      const stData = computeSupertrend(rawCandles, 10, 3);
      stSeries.setData(stData.map(d => ({ time: d.time, value: d.value })));

      const lastCandle = rawCandles[rawCandles.length - 1];
      document.getElementById('wmSymbol').innerText = currentSymbol;
      document.getElementById('wmPrice').innerText = '$' + lastCandle.close.toFixed(2);
      chart.timeScale().fitContent();
    }

    function computeSupertrend(candles, period, mult) {
      let result = [];
      let atr = [];
      let upper = [], lower = [];
      let inUp = true;

      for (let i = 0; i < candles.length; i++) {
        let tr = i === 0 ? candles[i].high - candles[i].low : Math.max(
          candles[i].high - candles[i].low,
          Math.abs(candles[i].high - candles[i - 1].close),
          Math.abs(candles[i].low - candles[i - 1].close)
        );
        if (i < period) atr.push(tr);
        else atr.push((atr[i - 1] * (period - 1) + tr) / period);

        let hl2 = (candles[i].high + candles[i].low) / 2;
        let bUp = hl2 + mult * atr[i];
        let bLow = hl2 - mult * atr[i];

        if (i === 0) {
          upper.push(bUp); lower.push(bLow);
          result.push({ time: candles[i].time, value: bLow, isUp: true });
          continue;
        }

        let fUp = bUp < upper[i - 1] || candles[i - 1].close > upper[i - 1] ? bUp : upper[i - 1];
        let fLow = bLow > lower[i - 1] || candles[i - 1].close < lower[i - 1] ? bLow : lower[i - 1];

        upper.push(fUp); lower.push(fLow);

        if (inUp) {
          if (candles[i].close < fLow) { inUp = false; result.push({ time: candles[i].time, value: fUp, isUp: false }); }
          else { result.push({ time: candles[i].time, value: fLow, isUp: true }); }
        } else {
          if (candles[i].close > fUp) { inUp = true; result.push({ time: candles[i].time, value: fLow, isUp: true }); }
          else { result.push({ time: candles[i].time, value: fUp, isUp: false }); }
        }
      }
      return result;
    }

    function connectLiveWebSocket() {
      if (ws) ws.close();
      const stream = `${currentSymbol.toLowerCase()}@kline_${currentTimeframe}`;
      ws = new WebSocket(`wss://stream.binance.com:9443/ws/${stream}`);

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        const k = data.k;
        const candle = {
          time: Math.floor(k.t / 1000),
          open: parseFloat(k.o),
          high: parseFloat(k.h),
          low: parseFloat(k.l),
          close: parseFloat(k.c)
        };

        const tfSecs = getTimeframeSeconds(currentTimeframe);
        currentCandleCloseTime = candle.time + tfSecs;

        let lastIdx = rawCandles.length - 1;
        if (rawCandles[lastIdx].time === candle.time) {
          rawCandles[lastIdx] = candle;
        } else {
          rawCandles.push(candle);
        }

        candleSeries.update(candle);
        plotSupertrend();
      };
    }

    // LIVE COUNTDOWN TIMER FUNCTION (MINUTES & SECONDS REMAINING)
    function startCountdownTimer() {
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        const now = Math.floor(Date.now() / 1000);
        let diff = currentCandleCloseTime - now;

        if (diff <= 0) {
          document.getElementById('candleTimer').innerText = "00:00 (Closing...)";
          return;
        }

        const mins = Math.floor(diff / 60);
        const secs = diff % 60;

        const formattedMins = String(mins).padStart(2, '0');
        const formattedSecs = String(secs).padStart(2, '0');

        document.getElementById('candleTimer').innerText = `${formattedMins}:${formattedSecs} min left`;
      }, 1000);
    }

    function changeSymbol(sym) {
      currentSymbol = sym;
      localStorage.setItem('tv_full_symbol', sym);
      loadHistoryData();
    }

    function changeTimeframe(tf, btn) {
      currentTimeframe = tf;
      localStorage.setItem('tv_full_tf', tf);

      document.querySelectorAll('#tfGroup button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      loadHistoryData();
    }

    window.onload = initChart;
  </script>
</body>
        </html>
