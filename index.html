<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BTC/USDT Trading System</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#07111d;color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}
header{
  height:82px;background:#0c1928;
  padding:9px 12px;border-bottom:1px solid #26384b;
}
.symbol{font-size:12px;color:#8da2b8}

  height:48px;background:#091522;
  display:flex;gap:5px;padding:6px;
  overflow-x:auto;white-space:nowrap;

<body>

<header>
  <div class="symbol">BINANCE • BTC/USDT</div>
  <div id="price">USDT --</div>
  <div id="status">Connecting...</div>
</header>

<div class="toolbar">
  <button onclick="changeTF('1m')">1M</button>
  <button onclick="changeTF('5m')">5M</button>
  <button onclick="changeTF('15m')">15M</button>
  <button onclick="changeTF('30m')">30M</button>
  <button onclick="changeTF('1h')">1H</button>
  <button onclick="goLive()">LIVE</button>
  <button onclick="resetChart()">RESET</button>

</div>

  <div class="card">
    <span>SUPERTREND</span>

  </div>

    <span>SIGNAL</span>

  </div>

  </div>

    <span>SL</span>

  </div>

    <span>TP1</span>
    <b id="tp1">--</b>
  </div>

  <div class="card">
    <span>TP2</span>
    <b id="tp2">--</b>
  </div>

  <div class="card">
    <span>TP3</span>
    <b id="tp3">--</b>
  </div>

  <div class="card">
    <span>TRAILING SL</span>
    <b id="tsl">--</b>
  </div>

  <div class="card">
    <span>ATR</span>
    <b id="atr">--</b>
  </div>

</div>

<script>
"use strict";

/* ==============================
   BTC SETTINGS
============================== */

const SYMBOL="BTCUSDT";

let tf="1m";

let candles=[];
let ws=null;
let reconnectTimer=null;

let ATR_PERIOD=10;
let ST_MULT=3;

let SL_PCT=0.50;
let TP1_PCT=0.50;
let TP2_PCT=1.00;
let TP3_PCT=1.50;

let lastSignalTime=0;
let lastSignal="WAIT";

let soundEnabled=false;
let audioCtx=null;

let trail=null;
let direction=null;


/* ==============================
   CANVAS
============================== */

const canvas=document.getElementById("chart");
const ctx=canvas.getContext("2d");

let pan=0;
let visible=60;

let dragging=false;
let startX=0;
let startPan=0;

let pinchStart=0;
let pinchVisible=60;


function resize(){

  const dpr=devicePixelRatio||1;

  canvas.width=innerWidth*dpr;
  canvas.height=canvas.clientHeight*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  draw();
}

addEventListener("resize",resize);


/* ==============================
   PRICE FORMAT
============================== */

function fmt(n){

  if(!Number.isFinite(n))return"--";

  return n.toLocaleString(
    "en-US",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}


/* ==============================
   SOUND
============================== */

function enableSound(){

  audioCtx=new(
    window.AudioContext||
    window.webkitAudioContext
  )();

  audioCtx.resume();

  soundEnabled=true;

  document.getElementById("sound")
    .textContent="🔔 SOUND ON";

  beep(800,.12);
}


function beep(freq,time){

  if(!soundEnabled||!audioCtx)return;

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();

  o.frequency.value=freq;
  o.type="sine";

  g.gain.setValueAtTime(
    .001,
    audioCtx.currentTime
  );

  g.gain.exponentialRampToValueAtTime(
    .25,
    audioCtx.currentTime+.02
  );

  g.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+time
  );

  o.connect(g);
  g.connect(audioCtx.destination);

  o.start();

  o.stop(
    audioCtx.currentTime+time
  );
}


function alertSound(type){

  if(type==="BUY"){

    beep(900,.14);

    setTimeout(
      ()=>beep(1200,.16),
      170
    );

  }else{

    beep(600,.14);

    setTimeout(
      ()=>beep(400,.16),
      170
    );

  }
}


/* ==============================
   BINANCE DATA
============================== */

async function loadData(){

  try{

    document.getElementById("status")
      .textContent="Loading BTC/USDT...";

    const url=
      "https://api.binance.com/api/v3/klines"+
      "?symbol="+SYMBOL+
      "&interval="+tf+
      "&limit=300";

    const r=await fetch(
      url,
      {cache:"no-store"}
    );

    if(!r.ok)
      throw Error("HTTP "+r.status);

    const data=await r.json();

    candles=data.map(k=>({

      time:+k[0],
      open:+k[1],
      high:+k[2],
      low:+k[3],
      close:+k[4],
      volume:+k[5]

    }));

    pan=0;

    trail=null;
    direction=null;

    update();

    resize();

  }catch(e){

    console.error(e);

    document.getElementById("status")
      .textContent=
      "Connection error";

  }

}


/* ==============================
   WEBSOCKET
============================== */

function connect(){

  if(ws){

    try{ws.close()}catch(e){}

  }

  clearTimeout(reconnectTimer);

  document.getElementById("status")
    .textContent="Connecting live...";


  const stream=
    SYMBOL.toLowerCase()+
    "@kline_"+tf;


  ws=new WebSocket(
    "wss://stream.binance.com:9443/ws/"+
    stream
  );


  ws.onopen=()=>{

    document.getElementById("status")
      .textContent=
      "🟢 LIVE • BTC/USDT";

  };


  ws.onmessage=e=>{

    const m=JSON.parse(e.data);

    if(!m.k)return;

    const k=m.k;

    const c={

      time:+k.t,
      open:+k.o,
      high:+k.h,
      low:+k.l,
      close:+k.c,
      volume:+k.v

    };

    const last=
      candles[candles.length-1];


    if(!last||last.time!==c.time){

      candles.push(c);

      if(candles.length>300)
        candles.shift();

    }else{

      candles[candles.length-1]=c;

    }

    update();

    checkSignal();

    updateTrailing();

    draw();

  };


  ws.onerror=()=>{

    document.getElementById("status")
      .textContent=
      "⚠️ Connection error";

  };


  ws.onclose=()=>{

    document.getElementById("status")
      .textContent=
      "Reconnecting...";

    reconnectTimer=setTimeout(
      connect,
      3000
    );

  };

}


/* ==============================
   ATR
============================== */

function atr(i){

  if(i<ATR_PERIOD)
    return null;

  let sum=0;

  for(
    let x=i-ATR_PERIOD+1;
    x<=i;
    x++
  ){

    const c=candles[x];
    const p=candles[x-1];

    sum+=Math.max(
      c.high-c.low,
      Math.abs(c.high-p.close),
      Math.abs(c.low-p.close)
    );

  }

  return sum/ATR_PERIOD;
}


/* ==============================
   SUPERTREND
============================== */

function supertrend(){

  const out=[];

  let upper=null;
  let lower=null;
  let trend=1;

  for(let i=0;i<candles.length;i++){

    const a=atr(i);

    if(a===null){

      out.push({
        value:null,
        trend:0,
        atr:null
      });

      continue;

    }

    const c=candles[i];

    const mid=
      (c.high+c.low)/2;

    let up=
      mid+ST_MULT*a;

    let dn=
      mid-ST_MULT*a;


    if(
      upper!==null &&
      candles[i-1].close<=upper
    )
      up=Math.min(up,upper);


    if(
      lower!==null &&
      candles[i-1].close>=lower
    )
      dn=Math.max(dn,lower);


    if(
      trend===-1 &&
      c.close>up
    )
      trend=1;

    else if(
      trend===1 &&
      c.close<dn
    )
      trend=-1;


    out.push({

      value:
        trend===1?dn:up,

      trend:trend,

      atr:a

    });


    upper=up;
    lower=dn;

  }

  return out;
}


/* ==============================
   LEVELS
============================== */

function levels(){

  if(candles.length<ATR_PERIOD+2)
    return null;

  const st=supertrend();

  const s=st[st.length-1];

  if(!s||!s.trend)
    return null;

  const entry=
    candles[candles.length-1].close;

  let sl,tp1,tp2,tp3;

  if(s.trend===1){

    sl=entry*(1-SL_PCT/100);

    tp1=entry*(1+TP1_PCT/100);

    tp2=entry*(1+TP2_PCT/100);

    tp3=entry*(1+TP3_PCT/100);

  }else{

    sl=entry*(1+SL_PCT/100);

    tp1=entry*(1-TP1_PCT/100);

    tp2=entry*(1-TP2_PCT/100);

    tp3=entry*(1-TP3_PCT/100);

  }

  return{
    trend:s.trend,
    atr:s.atr,
    entry,
    sl,
    tp1,
    tp2,
    tp3
  };
}


/* ==============================
   SIGNAL
============================== */

function checkSignal(){

  if(candles.length<ATR_PERIOD+3)
    return;

  const st=supertrend();

  const a=st[st.length-1];
  const b=st[st.length-2];

  let sig=null;

  if(
    b.trend===-1 &&
    a.trend===1
  )
    sig="BUY";

  if(
    b.trend===1 &&
    a.trend===-1
  )
    sig="SELL";


  if(!sig)return;


  const t=
    candles[candles.length-1].time;


  /*
    हर नए signal candle पर केवल
    एक alert.
  */

  if(t===lastSignalTime)
    return;


  lastSignalTime=t;
  lastSignal=sig;

  direction=sig;

  trail=null;

  if(soundEnabled)
    alertSound(sig);


  const el=
    document.getElementById("signal");

  el.textContent=sig;

  el.className=
    sig==="BUY"?"green":"red";

}


/* ==============================
   TRAILING SL
============================== */

function updateTrailing(){

  if(!direction)return;

  const price=
    candles[candles.length-1].close;

  const distance=
    price*(SL_PCT/100);


  if(direction==="BUY"){

    const x=
      price-distance;

    if(
      trail===null||
      x>trail
    )
      trail=x;

  }else{

    const x=
      price+distance;

    if(
      trail===null||
      x<trail
    )
      trail=x;

  }


  document.getElementById("tsl")
    .textContent=fmt(trail);

}


/* ==============================
   DASHBOARD
============================== */

function update(){

  if(!candles.length)return;

  const c=
    candles[candles.length-1];


  document.getElementById("price")
    .textContent=
    "$"+fmt(c.close)+" USDT";


  const l=levels();

  if(!l)return;


  const trend=
    document.getElementById("trend");

  trend.textContent=
    l.trend===1?
    "BULLISH":
    "BEARISH";

  trend.className=
    l.trend===1?
    "green":
    "red";


  document.getElementById("entry")
    .textContent=fmt(l.entry);

  document.getElementById("sl")
    .textContent=fmt(l.sl);

  document.getElementById("tp1")
    .textContent=fmt(l.tp1);

  document.getElementById("tp2")
    .textContent=fmt(l.tp2);

  document.getElementById("tp3")
    .textContent=fmt(l.tp3);

  document.getElementById("atr")
    .textContent=fmt(l.atr);

}


/* ==============================
   DRAW
============================== */

function draw(){

  const W=canvas.clientWidth;
  const H=canvas.clientHeight;

  ctx.clearRect(0,0,W,H);

  if(candles.length<2)return;


  const right=70;
  const chartW=W-right;

  const step=
    chartW/visible;


  let end=
    candles.length-
    Math.round(pan);

  end=Math.max(
    1,
    Math.min(
      candles.length,
      end
    )
  );


  const start=
    Math.max(
      0,
      end-visible
    );


  const data=
    candles.slice(
      start,
      end
    );


  let min=
    Math.min(
      ...data.map(x=>x.low)
    );

  let max=
    Math.max(
      ...data.map(x=>x.high)
    );


  const st=supertrend();


  for(
    let i=start;
    i<end;
    i++
  ){

    if(
      st[i]&&
      Number.isFinite(st[i].value)
    ){

      min=Math.min(
        min,
        st[i].value
      );

      max=Math.max(
        max,
        st[i].value
      );

    }

  }


  const l=levels();

  if(l){

    min=Math.min(
      min,
      l.sl,
      l.tp1,
      l.tp2,
      l.tp3
    );

    max=Math.max(
      max,
      l.sl,
      l.tp1,
      l.tp2,
      l.tp3
    );

  }


  const pad=25;

  const range=
    Math.max(
      1,
      max-min
    );


  const Y=v=>
    pad+
    ((max-v)/range)*
    (H-pad*2);


  /* grid */

  ctx.strokeStyle="#17283a";
  ctx.lineWidth=1;

  for(let i=1;i<6;i++){

    const y=
      pad+
      (H-pad*2)*i/6;

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(W,y);

    ctx.stroke();

  }


  /* candles */

  const body=
    Math.max(
      2,
      step*.62
    );


  data.forEach((c,i)=>{

    const x=
      i*step+
      step/2;

    const up=
      c.close>=c.open;


    ctx.strokeStyle=
      up?"#00d084":"#ff526d";

    ctx.fillStyle=
      up?"#00d084":"#ff526d";


    ctx.beginPath();

    ctx.moveTo(
      x,
      Y(c.high)
    );

    ctx.lineTo(
      x,
      Y(c.low)
    );

    ctx.stroke();


    ctx.fillRect(

      x-body/2,

      Math.min(
        Y(c.open),
        Y(c.close)
      ),

      body,

      Math.max(
        1,
        Math.abs(
          Y(c.close)-
          Y(c.open)
        )
      )

    );

  });


  /* SuperTrend */

  let prev=null;

  ctx.lineWidth=2;


  for(
    let i=start;
    i<end;
    i++
  ){

    const s=st[i];

    if(
      !s||
      !Number.isFinite(s.value)
    ){

      prev=null;
      continue;

    }


    const x=
      (i-start)*step+
      step/2;

    const y=Y(s.value);


    ctx.strokeStyle=
      s.trend===1?
      "#00d084":
      "#ff526d";


    if(prev&&prev.trend===s.trend){

      ctx.beginPath();

      ctx.moveTo(
        prev.x,
        prev.y
      );

      ctx.lineTo(x,y);

      ctx.stroke();

    }


    prev={
      x,
      y,
      trend:s.trend
    };

  }


  /* live price */

  if(pan===0){

    const p=
      candles[
        candles.length-1
      ].close;

    const y=Y(p);


    ctx.strokeStyle="#ffd54a";
    ctx.setLineDash([4,4]);

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(chartW,y);

    ctx.stroke();

    ctx.setLineDash([]);


    ctx.fillStyle="#ffd54a";
    ctx.font="bold 11px Arial";

    ctx.fillText(
      "$"+fmt(p),
      5,
      Math.max(14,y-5)
    );

  }


  /* levels */

  if(l&&pan===0){

    levelLine(
      l.entry,
      "#ffd54a",
      "ENTRY"
    );

    levelLine(
      l.sl,
      "#ff526d",
      "SL"
    );

    levelLine(
      l.tp1,
      "#00d084",
      "TP1"
    );

    levelLine(
      l.tp2,
      "#00d084",
      "TP2"
    );

    levelLine(
      l.tp3,
      "#00d084",
      "TP3"
    );

    if(trail!==null){

      levelLine(
        trail,
        "#ffffff",
        "TSL"
      );

    }

  }

}


/* ==============================
   LEVEL LINE
============================== */

function levelLine(
  value,
  color,
  text
){

  const W=canvas.clientWidth;
  const H=canvas.clientHeight;

  const right=70;
  const chartW=W-right;

  const step=
    chartW/visible;


  let end=
    candles.length-
    Math.round(pan);

  end=Math.max(
    1,
    Math.min(
      candles.length,
      end
    )
  );


  const start=
    Math.max(
      0,
      end-visible
    );


  const data=
    candles.slice(
      start,
      end
    );


  let min=
    Math.min(
      ...data.map(x=>x.low)
    );

  let max=
    Math.max(
      ...data.map(x=>x.high)
    );


  const st=supertrend();


  for(
    let i=start;
    i<end;
    i++
  ){

    if(
      st[i]&&
      Number.isFinite(st[i].value)
    ){

      min=Math.min(
        min,
        st[i].value
      );

      max=Math.max(
        max,
        st[i].value
      );

    }

  }


  const l=levels();

  if(l){

    min=Math.min(
      min,
      l.sl,
      l.tp1,
      l.tp2,
      l.tp3
    );

    max=Math.max(
      max,
      l.sl,
      l.tp1,
      l.tp2,
      l.tp3
    );

  }


  const pad=25;

  const range=
    Math.max(
      1,
      max-min
    );


  const y=
    pad+
    ((max-value)/range)*
    (H-pad*2);


  ctx.strokeStyle=color;

  ctx.setLineDash([4,4]);

  ctx.beginPath();

  ctx.moveTo(
    0,
    y
  );

  ctx.lineTo(
    chartW,
    y
  );

  ctx.stroke();

  ctx.setLineDash([]);


  ctx.fillStyle=color;

  ctx.font="bold 10px Arial";

  ctx.fillText(
    text,
    chartW+5,
    y
  );

}


/* ==============================
   DRAG
============================== */

canvas.addEventListener(
  "pointerdown",
  e=>{

    dragging=true;

    startX=e.clientX;
    startPan=pan;

    canvas.setPointerCapture(
      e.pointerId
    );

  }
);


canvas.addEventListener(
  "pointermove",
  e=>{

    if(!dragging)return;

    const dx=e.clientX-startX;

    const step=
      canvas.clientWidth/
      visible;

    pan=
      startPan-dx/step;


    const maxPan=
      Math.max(
        0,
        candles.length-visible
      );


    pan=Math.max(
      0,
      Math.min(
        maxPan,
        pan
      )
    );


    draw();

  }
);


canvas.addEventListener(
  "pointerup",
  ()=>dragging=false
);

canvas.addEventListener(
  "pointercancel",
  ()=>dragging=false
);


/* ==============================
   PINCH ZOOM
============================== */

function dist(a,b){

  const x=a.clientX-b.clientX;
  const y=a.clientY-b.clientY;

  return Math.sqrt(
    x*x+y*y
  );

}


canvas.addEventListener(
  "touchstart",
  e=>{

    if(e.touches.length===2){

      pinchStart=
        dist(
          e.touches[0],
          e.touches[1]
        );

      pinchVisible=visible;

    }

  },
  {passive:true}
);


canvas.addEventListener(
  "touchmove",
  e=>{

    if(e.touches.length!==2)
      return;

    if(!pinchStart)
      return;


    const d=
      dist(
        e.touches[0],
        e.touches[1]
      );


    visible=Math.round(
      pinchVisible*
      pinchStart/d
    );


    visible=Math.max(
      20,
      Math.min(
        120,
        visible
      )
    );


    draw();

  },
  {passive:true}
);


/* ==============================
   CONTROLS
============================== */

async function changeTF(newTF){

  tf=newTF;

  candles=[];

  lastSignalTime=0;
  lastSignal="WAIT";

  trail=null;
  direction=null;

  if(ws){

    try{ws.close()}catch(e){}

  }

  await loadData();

  connect();

}


function goLive(){

  pan=0;

  draw();

}


function resetChart(){

  visible=60;

  pan=0;

  draw();

}
