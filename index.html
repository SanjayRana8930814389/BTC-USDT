<script>

"use strict";


/* =========================================
   STATE
========================================= */

const state={

symbol:"BTCUSDT",

tf:"1m",

candles:[],

price:0,

atr:[],

st:[],

direction:[],

ema9:[],

ema21:[],

ema50:[],

ema200:[],

rsi:[],

macdLine:[],

macdSignal:[],

vwap:[],

bbUpper:[],

bbLower:[],

adx:[],

socket:null,

trade:null,

lastClosedTime:0,

lastSignal:0,

reconnectTimer:null

};


const $=id=>
document.getElementById(id);


/* =========================================
   NUMBER FORMAT
========================================= */

function fmt(n){

if(!Number.isFinite(n))
return "--";

return n.toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}


function volumeFmt(n){

if(!Number.isFinite(n))
return "--";

if(n>=1000000)
return (n/1000000).toFixed(2)+"M";

if(n>=1000)
return (n/1000).toFixed(2)+"K";

return n.toFixed(2);

}


/* =========================================
   LOAD HISTORICAL CANDLES
========================================= */

async function loadCandles(){

try{

$("status").innerText=
"Loading BTC/USDT candles...";


const url=
"https://api.binance.com/api/v3/klines"+
"?symbol=BTCUSDT"+
"&interval="+
encodeURIComponent(state.tf)+
"&limit=200";


const response=
await fetch(url);


if(!response.ok)
throw new Error("Binance API error");


const data=
await response.json();


state.candles=
data.map(k=>({

time:Number(k[0]),

open:Number(k[1]),

high:Number(k[2]),

low:Number(k[3]),

close:Number(k[4]),

volume:Number(k[5]),

closed:true

}));


if(state.candles.length){

state.price=
state.candles[
state.candles.length-1
].close;

state.lastClosedTime=
state.candles[
state.candles.length-1
].time;

}


calculate();

updatePrice();

draw();


$("status").innerText=
"🟢 BINANCE LIVE";

}
catch(error){

console.error(error);

$("status").innerText=
"🔴 Binance data error";

}

}


/* =========================================
   WEBSOCKET
========================================= */

function connectWebSocket(){

if(state.socket){

try{
state.socket.close();
}catch(e){}

state.socket=null;

}


const url=
"wss://stream.binance.com:9443/ws/btcusdt@kline_"+
state.tf;


state.socket=
new WebSocket(url);


state.socket.onopen=()=>{

$("status").innerText=
"🟢 BINANCE LIVE";

};


state.socket.onmessage=(event)=>{

try{

const data=
JSON.parse(event.data);

if(!data.k)
return;


const k=data.k;


const candle={

time:Number(k.t),

open:Number(k.o),

high:Number(k.h),

low:Number(k.l),

close:Number(k.c),

volume:Number(k.v),

closed:Boolean(k.x)

};


updateCandle(candle);

}
catch(error){

console.error(error);

}

};


state.socket.onerror=()=>{

$("status").innerText=
"🔴 WebSocket error";

};


state.socket.onclose=()=>{

$("status").innerText=
"Reconnecting...";


clearTimeout(
state.reconnectTimer
);


state.reconnectTimer=
setTimeout(
connectWebSocket,
3000
);

};

}


/* =========================================
   UPDATE LIVE CANDLE
========================================= */

function updateCandle(candle){

const last=
state.candles[
state.candles.length-1
];


if(
!last ||
last.time!==candle.time
){

state.candles.push(candle);

if(state.candles.length>200)
state.candles.shift();

}
else{

state.candles[
state.candles.length-1
]=candle;

}


state.price=
candle.close;


updatePrice();

calculate();

draw();


/*
Only generate a new signal alert
when a candle actually closes.
*/

if(
candle.closed &&
candle.time!==state.lastClosedTime
){

state.lastClosedTime=
candle.time;

checkClosedSignal();

}

}


/* =========================================
   PRICE
========================================= */

function updatePrice(){

$("price").innerText=
"$"+
fmt(state.price)+
" USDT";

}


/* =========================================
   TRUE RANGE
========================================= */

function trueRange(i){

const c=
state.candles[i];


if(i===0)
return c.high-c.low;


const p=
state.candles[i-1];


return Math.max(

c.high-c.low,

Math.abs(
c.high-p.close
),

Math.abs(
c.low-p.close
)

}


/* =========================================
   ATR
========================================= */

function calcATR(period){

const n=
state.candles.length;

const out=
new Array(n).fill(null);


if(n<=period)
return out;


let sum=0;


for(
let i=1;
i<=period;
i++
){

sum+=trueRange(i);

}


out[period]=
sum/period;


for(
let i=period+1;
i<n;
i++
){

out[i]=
(
out[i-1]*(period-1)+
trueRange(i)
)/period;

}


return out;

}


/* =========================================
   EMA
========================================= */

function calcEMA(values,period){

const out=
new Array(values.length)
.fill(null);


if(values.length<period)
return out;


let sum=0;


for(
let i=0;
i<period;
i++
){

sum+=values[i];

}


out[period-1]=
sum/period;


const alpha=
2/(period+1);


for(
let i=period;
i<values.length;
i++
){

out[i]=
alpha*values[i]+
(1-alpha)*out[i-1];

}


return out;

}


/* =========================================
   SUPERTREND
========================================= */

function calcSuperTrend(period,mult){

const n=
state.candles.length;

const atr=
calcATR(period);

const upper=
new Array(n).fill(null);

const lower=
new Array(n).fill(null);

const st=
new Array(n).fill(null);

const dir=
new Array(n).fill(0);


for(
let i=period;
i<n;
i++
){

const c=
state.candles[i];

const mid=
(c.high+c.low)/2;

const basicUpper=
mid+mult*atr[i];

const basicLower=
mid-mult*atr[i];


if(i===period){

upper[i]=basicUpper;

lower[i]=basicLower;

dir[i]=
c.close>=mid
?
1
:
-1;

st[i]=
dir[i]===1
?
lower[i]
:
upper[i];

continue;

}


const prevClose=
state.candles[i-1].close;


upper[i]=
(
basicUpper<upper[i-1] ||
prevClose>upper[i-1]
)
?
basicUpper
:
upper[i-1];


lower[i]=
(
basicLower>lower[i-1] ||
prevClose<lower[i-1]
)
?
basicLower
:
lower[i-1];


if(
dir[i-1]===-1 &&
c.close>upper[i-1]
){

dir[i]=1;

}
else if(
dir[i-1]===1 &&
c.close<lower[i-1]
){

dir[i]=-1;

}
else{

dir[i]=dir[i-1];

}


st[i]=
dir[i]===1
?
lower[i]
:
upper[i];

}


return{
atr,
st,
dir
};

}


/* =========================================
   RSI
========================================= */

function calcRSI(period){

const n=
state.candles.length;

const out=
new Array(n).fill(null);


if(n<=period)
return out;


let gain=0;

let loss=0;


for(
let i=1;
i<=period;
i++
){

const change=
state.candles[i].close-
state.candles[i-1].close;


if(change>0)
gain+=change;
else
loss-=change;

}


gain/=period;

loss/=period;


out[period]=
loss===0
?
100
:
100-(100/(1+gain/loss));


for(
let i=period+1;
i<n;
i++
){

const change=
state.candles[i].close-
state.candles[i-1].close;


const g=
change>0?change:0;

const l=
change<0?-change:0;


gain=
(
gain*(period-1)+g
)/period;


loss=
(
loss*(period-1)+l
)/period;


out[i]=
loss===0
?
100
:
100-(100/(1+gain/loss));

}


return out;

}


/* =========================================
   VWAP
========================================= */

function calcVWAP(){

const out=
new Array(
state.candles.length
)
.fill(null);


let pv=0;

let vol=0;


for(
let i=0;
i<state.candles.length;
i++
){

const c=
state.candles[i];

const typical=
(c.high+c.low+c.close)/3;


pv+=
typical*c.volume;

vol+=c.volume;


out[i]=
vol>0
?
pv/vol
:
null;

}


return out;

}


/* =========================================
   BOLLINGER
========================================= */

function calcBB(period,std){

const n=
state.candles.length;

const upper=
new Array(n).fill(null);

const lower=
new Array(n).fill(null);


for(
let i=period-1;
i<n;
i++
){

let sum=0;


for(
let j=i-period+1;
j<=i;
j++
){

sum+=
state.candles[j].close;

}


const mean=
sum/period;


let variance=0;


for(
let j=i-period+1;
j<=i;
j++
){

variance+=
Math.pow(
state.candles[j].close-mean,
2
);

}


const sd=
Math.sqrt(
variance/period
);


upper[i]=
mean+std*sd;

lower[i]=
mean-std*sd;

}


return{
upper,
lower
};

}


/* =========================================
   MACD
========================================= */

function calcMACD(){

const closes=
state.candles.map(
c=>c.close
);


const fast=
calcEMA(closes,12);

const slow=
calcEMA(closes,26);

const line=
new Array(closes.length)
.fill(null);


for(
let i=0;
i<closes.length;
i++
){

if(
fast[i]!==null &&
slow[i]!==null
){

line[i]=
fast[i]-slow[i];

}

}


const macdValues=
line.map(
v=>v===null?0:v
);


const signal=
calcEMA(
macdValues,
9
);


return{
line,
signal
};

}


/* =========================================
   ADX
========================================= */

function calcADX(period=14){

const n=
state.candles.length;

const out=
new Array(n).fill(null);


if(n<=period*2)
return out;


const tr=
new Array(n).fill(0);

const plusDM=
new Array(n).fill(0);

const minusDM=
new Array(n).fill(0);


for(
let i=1;
i<n;
i++
){

const c=
state.candles[i];

const p=
state.candles[i-1];


tr[i]=trueRange(i);


const up=
c.high-p.high;

const down=
p.low-c.low;


plusDM[i]=
up>down && up>0
?
up
:
0;


minusDM[i]=
down>up && down>0
?
down
:
0;

}


let trSum=0;

let plusSum=0;

let minusSum=0;


for(
let i=1;
i<=period;
i++
){

trSum+=tr[i];

plusSum+=plusDM[i];

minusSum+=minusDM[i];

}


const dx=[];


for(
let i=period;
i<n;
i++
){

if(i>period){

trSum=
trSum-
trSum/period+
tr[i];

plusSum=
plusSum-
plusSum/period+
plusDM[i];

minusSum=
minusSum-
minusSum/period+
minusDM[i];

}


const pdi=
trSum
?
100*plusSum/trSum
:
0;

const mdi=
trSum
?
100*minusSum/trSum
:
0;


const value=
pdi+mdi
?
100*Math.abs(pdi-mdi)/(pdi+mdi)
:
0;


dx.push(value);


if(dx.length>=period){

const recent=
dx.slice(
dx.length-period
);


out[i]=
recent.reduce(
(a,b)=>a+b,
0
)/recent.length;

}

}


return out;

}


/* =========================================
   CALCULATE ALL
========================================= */

function calculate(){

if(
state.candles.length<30
)
return;


const closes=
state.candles.map(
c=>c.close
);


const stPeriod=
Math.max(
1,
Number($("stPeriod").value)||10
);


const multiplier=
Number($("stMultiplier").value)||3;


const st=
calcSuperTrend(
stPeriod,
multiplier
);


state.atr=
st.atr;

state.st=
st.st;

state.direction=
st.dir;


state.ema9=
calcEMA(
closes,
Math.max(
1,
Number($("ema9Length").value)||9
)
);


state.ema21=
calcEMA(
closes,
Math.max(
1,
Number($("ema21Length").value)||21
)
);


state.ema50=
calcEMA(
closes,
Math.max(
1,
Number($("ema50Length").value)||50
)
);


state.ema200=
calcEMA(
closes,
Math.max(
1,
Number($("ema200Length").value)||200
)
);


state.rsi=
calcRSI(
Math.max(
1,
Number($("rsiPeriod").value)||14
)
);


state.vwap=
calcVWAP();


const bb=
calcBB(
Math.max(
1,
Number($("bbPeriod").value)||20
),
Number($("bbStd").value)||2
);


state.bbUpper=
bb.upper;

state.bbLower=
bb.lower;


const macd=
calcMACD();


state.macdLine=
macd.line;

state.macdSignal=
macd.signal;


state.adx=
calcADX(14);


const i=
state.candles.length-1;


if(state.st[i]!==null)
$("supertrend").innerText=
fmt(state.st[i]);


if(state.rsi[i]!==null)
$("rsi").innerText=

/* =========================================
   SIGNAL CALCULATION
========================================= */

function getSignal(i){

let score=0;

let total=0;

const close=
state.candles[i].close;


/* SuperTrend */

if($("useST").checked){

total++;

if(state.direction[i]===1)
score++;

else if(state.direction[i]===-1)
score--;

}


/* EMA 9 */

if($("useEMA9").checked){

total++;

if(
state.ema9[i]!==null
){

if(close>state.ema9[i])
score++;

else
score--;

}

}


/* EMA 21 */

if($("useEMA21").checked){

total++;

if(
state.ema21[i]!==null
){

if(close>state.ema21[i])
score++;

else
score--;

}

}


/* EMA 50 */

if($("useEMA50").checked){

total++;

if(
state.ema50[i]!==null
){

if(close>state.ema50[i])
score++;

else
score--;

}

}


/* EMA 200 */

if($("useEMA200").checked){

total++;

if(
state.ema200[i]!==null
){

if(close>state.ema200[i])
score++;

else
score--;

}

}


/* VWAP */

if($("useVWAP").checked){

total++;

if(
state.vwap[i]!==null
){

if(close>state.vwap[i])
score++;

else
score--;

}

}


/* RSI */

if(state.rsi[i]!==null){

total++;

if(
state.rsi[i]>=55 &&
state.rsi[i]<75
){

score++;

}
else if(
state.rsi[i]<=45 &&
state.rsi[i]>25
){

score--;

}

}


/* MACD */

if(
state.macdLine[i]!==null &&
state.macdSignal[i]!==null
){

total++;

if(
state.macdLine[i]>
state.macdSignal[i]
)
score++;

else
score--;

}


/* Minimum 60% agreement */

if(
total>0 &&
score>=Math.ceil(total*0.60)
)
return 1;


if(
total>0 &&
score<=-Math.ceil(total*0.60)
)
return -1;


return 0;

}
