<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BTC/USDT Live Chart</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#07111d;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

.header{
  padding:12px;
  background:#0d1928;
  border-bottom:1px solid #26384f;
}

.symbol{
  font-size:14px;
  color:#9eacbd;
}

.price{
  font-size:28px;
  font-weight:bold;
  margin-top:4px;
}

.status{
  margin-top:5px;
  font-size:13px;
  color:#ffd54a;
}

.controls{
  padding:10px;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  background:#091523;
}

button{
  background:#17283e;
  color:white;
  border:1px solid #38506d;
  border-radius:7px;
  padding:9px 13px;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.liveBtn{
  border-color:#00d084;
  color:#00d084;
}

.chart{
  margin:10px;
  height:520px;
  background:#0b1726;
  border:1px solid #26384f;
  border-radius:10px;
  overflow:hidden;
  position:relative;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
  cursor:grab;
}

canvas.dragging{
  cursor:grabbing;
}

.chartHint{
  position:absolute;
  top:8px;
  left:10px;
  font-size:11px;
  color:#73869d;
  pointer-events:none;
}

.info{
  margin:10px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.box{
  background:#122238;
  border-radius:7px;
  padding:9px;
}

.box small{
  color:#9eacbd;
}

.box b{
  display:block;
  margin-top:4px;
}

@media(max-width:700px){

  .chart{
    height:430px;
  }

  .info{
    grid-template-columns:repeat(2,1fr);
  }

  .price{
    font-size:25px;
  }
}

</style>
</head>

<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

  <div class="symbol">
    BINANCE • BTC/USDT
  </div>

  <div id="price" class="price">
    $--
  </div>

  <div id="status" class="status">
    Starting...
  </div>

</div>


<!-- =========================
     CONTROLS
========================= -->

<div class="controls">

  <button onclick="changeTF('1m')">
    1M
  </button>

  <button onclick="changeTF('5m')">
    5M
  </button>

  <button onclick="changeTF('15m')">
    15M
  </button>

  <button onclick="changeTF('30m')">
    30M
  </button>

  <button onclick="changeTF('1h')">
    1H
  </button>

  <button class="liveBtn" onclick="goLive()">
    LIVE
  </button>

  <button onclick="restart()">
    Refresh
  </button>

</div>


<!-- =========================
     CHART
========================= -->

<div class="chart">

  <canvas id="chart"></canvas>

  <div class="chartHint">
    Drag chart ← →
  </div>

</div>


<!-- =========================
     CANDLE DATA
========================= -->

<div class="info">

  <div class="box">
    <small>OPEN</small>
    <b id="open">--</b>
  </div>

  <div class="box">
    <small>HIGH</small>
    <b id="high">--</b>
  </div>

  <div class="box">
    <small>LOW</small>
    <b id="low">--</b>
  </div>

  <div class="box">
    <small>CLOSE</small>
    <b id="close">--</b>
  </div>

  <div class="box">
    <small>TIMEFRAME</small>
    <b id="tf">1M</b>
  </div>

  <div class="box">
    <small>CANDLES</small>
    <b id="count">0</b>
  </div>

</div>


<script>

"use strict";


/* ==================================================
   SETTINGS
================================================== */

const SYMBOL = "BTCUSDT";

let timeframe = "1m";

let candles = [];

let socket = null;

let reconnectTimer = null;


/*
   Right side empty space
   for current live candle
*/

const RIGHT_SPACE = 80;


/*
   Number of candles visible
*/

const VISIBLE_CANDLES = 60;


/*
   Horizontal chart position.

   0 = current/live position

   Positive value = move toward older candles
*/

let panOffset = 0;


/* ==================================================
   CANVAS
================================================== */

const canvas =
  document.getElementById("chart");

const ctx =
  canvas.getContext("2d");


function $(id){

  return document.getElementById(id);

}


/* ==================================================
   PRICE FORMAT
================================================== */

function formatPrice(value){

  if(!Number.isFinite(value)){
    return "--";
  }

  return Number(value).toLocaleString(
    "en-US",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


/* ==================================================
   STATUS
================================================== */

function setStatus(text){

  $("status").textContent = text;

}


/* ==================================================
   LOAD HISTORICAL CANDLES
================================================== */

async function loadCandles(){

  try{

    setStatus("Loading candles...");


    const url =
      "https://api.binance.com/api/v3/klines" +
      "?symbol=" +
      SYMBOL +
      "&interval=" +
      timeframe +
      "&limit=200";


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    candles =
      data.map(function(k){

        return {

          time:Number(k[0]),

          open:Number(k[1]),

          high:Number(k[2]),

          low:Number(k[3]),

          close:Number(k[4]),

          volume:Number(k[5])

        };

      });


    panOffset = 0;


    updateScreen();

    draw();


    setStatus(
      "Historical candles loaded"
    );

  }
  catch(error){

    console.error(error);

    setStatus(
      "History error: " +
      error.message
    );

  }

}


/* ==================================================
   WEBSOCKET CONNECT
================================================== */

function connect(){

  if(socket){

    try{
      socket.close();
    }
    catch(e){}

  }


  clearTimeout(
    reconnectTimer
  );


  setStatus(
    "Connecting live..."
  );


  const stream =
    SYMBOL.toLowerCase() +
    "@kline_" +
    timeframe;


  const url =
    "wss://stream.binance.com:9443/ws/" +
    stream;


  try{

    socket =
      new WebSocket(url);

  }
  catch(error){

    reconnect();

    return;

  }


  socket.onopen =
    function(){

      setStatus(
        "🟢 LIVE • BTC/USDT"
      );

    };


  socket.onmessage =
    function(event){

      try{

        const message =
          JSON.parse(event.data);


        if(!message.k){
          return;
        }


        const k =
          message.k;


        /*
          Current live candle
        */

        const candle = {

          time:Number(k.t),

          open:Number(k.o),

          high:Number(k.h),

          low:Number(k.l),

          close:Number(k.c),

          volume:Number(k.v)

        };


        const last =
          candles[candles.length - 1];


        /*
          New candle
        */

        if(
          !last ||
          last.time !== candle.time
        ){

          candles.push(
            candle
          );


          if(candles.length > 200){

            candles.shift();

          }

        }

        /*
          Update current candle
        */

        else{

          candles[
            candles.length - 1
          ] = candle;

        }


        /*
          Update price
        */

        $("price").textContent =
          "$" +
          formatPrice(candle.close) +
          " USDT";


        updateScreen();

        draw();

      }
      catch(error){

        console.error(
          "WebSocket message error:",
          error
        );

      }

    };


  socket.onerror =
    function(){

      setStatus(
        "⚠️ Live connection error"
      );

    };


  socket.onclose =
    function(){

      setStatus(
        "Reconnecting..."
      );


      reconnectTimer =
        setTimeout(
          connect,
          3000
        );

    };

}


/* ==================================================
   RECONNECT
================================================== */

function reconnect(){

  clearTimeout(
    reconnectTimer
  );


  reconnectTimer =
    setTimeout(
      connect,
      3000
    );

}


/* ==================================================
   UPDATE SCREEN
================================================== */

function updateScreen(){

  if(candles.length === 0){
    return;
  }


  const c =
    candles[
      candles.length - 1
    ];


  $("price").textContent =
    "$" +
    formatPrice(c.close) +
    " USDT";


  $("open").textContent =
    formatPrice(c.open);


  $("high").textContent =
    formatPrice(c.high);


  $("low").textContent =
    formatPrice(c.low);


  $("close").textContent =
    formatPrice(c.close);


  $("tf").textContent =
    timeframe.toUpperCase();


  $("count").textContent =
    candles.length;

}


/* ==================================================
   CHANGE TIMEFRAME
================================================== */

async function changeTF(tf){

  timeframe = tf;

  panOffset = 0;

  candles = [];


  $("tf").textContent =
    tf.toUpperCase();


  if(socket){

    try{
      socket.close();
    }
    catch(e){}

  }


  await loadCandles();

  connect();

}


/* ==================================================
   GO LIVE
================================================== */

function goLive(){

  /*
    Return chart to the newest candle
  */

  panOffset = 0;

  draw();


  setStatus(
    "🟢 LIVE • BTC/USDT"
  );

}


/* ==================================================
   RESTART
================================================== */

async function restart(){

  if(socket){

    try{
      socket.close();
    }
    catch(e){}

  }


  clearTimeout(
    reconnectTimer
  );


  candles = [];

  panOffset = 0;


  await loadCandles();

  connect();

}


/* ==================================================
   CANVAS RESIZE
================================================== */

function resizeCanvas(){

  const box =
    canvas.parentElement;


  const dpr =
    window.devicePixelRatio || 1;


  canvas.width =
    box.clientWidth * dpr;


  canvas.height =
    box.clientHeight * dpr;


  canvas.style.width =
    box.clientWidth + "px";


  canvas.style.height =
    box.clientHeight + "px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  draw();

}


window.addEventListener(
  "resize",
  resizeCanvas
);


/* ==================================================
   DRAW CHART
================================================== */

function draw(){

  if(candles.length < 2){
    return;
  }


  const W =
    canvas.parentElement.clientWidth;


  const H =
    canvas.parentElement.clientHeight;


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    Leave space on right
  */

  const chartWidth =
    W - RIGHT_SPACE;


  /*
    Candle width
  */

  const step =
    chartWidth /
    VISIBLE_CANDLES;


  const bodyWidth =
    Math.max(
      2,
      step * 0.62
    );


  /*
    Calculate starting candle.

    panOffset = 0
    means newest candles.

    Increasing panOffset
    moves toward older candles.
  */

  let endIndex =
    candles.length -
    Math.round(panOffset);


  if(endIndex > candles.length){

    endIndex =
      candles.length;

  }


  if(endIndex < 1){

    endIndex = 1;

  }


  let startIndex =
    endIndex -
    VISIBLE_CANDLES;


  if(startIndex < 0){

    startIndex = 0;

  }


  const data =
    candles.slice(
      startIndex,
      endIndex
    );


  if(data.length === 0){
    return;
  }


  /*
    Price range
  */

  let min =
    Math.min(
      ...data.map(
        c => c.low
      )
    );


  let max =
    Math.max(
      ...data.map(
        c => c.high
      )
    );


  const padding = 25;


  const range =
    Math.max(
      1,
      max - min
    );


  function Y(value){

    return padding +
      (
        (max - value) /
        range
      ) *
      (
        H -
        padding * 2
      );

  }


  /* ==================================================
     GRID
  ================================================== */

  ctx.strokeStyle =
    "#1a2a3e";

  ctx.lineWidth = 1;


  for(let i=1;i<5;i++){

    const y =
      padding +
      (
        H -
        padding * 2
      ) *
      i / 5;


    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      W,
      y
    );

    ctx.stroke();

  }


  /* ==================================================
     CANDLES
  ================================================== */

  data.forEach(
    function(c,i){

      /*
        Position candle
      */

      const x =
        i * step +
        step / 2;


      const openY =
        Y(c.open);


      const closeY =
        Y(c.close);


      const highY =
        Y(c.high);


      const lowY =
        Y(c.low);


      const bullish =
        c.close >= c.open;


      if(bullish){

        ctx.strokeStyle =
          "#00d084";

        ctx.fillStyle =
          "#00d084";

      }
      else{

        ctx.strokeStyle =
          "#ff526d";

        ctx.fillStyle =
          "#ff526d";

      }


      /*
        Wick
      */

      ctx.beginPath();

      ctx.moveTo(
        x,
        highY
      );

      ctx.lineTo(
        x,
        lowY
      );

      ctx.stroke();


      /*
        Body
      */

      ctx.fillRect(

        x -
        bodyWidth / 2,

        Math.min(
          openY,
          closeY
        ),

        bodyWidth,

        Math.max(
          1,
          Math.abs(
            closeY -
            openY
          )
        )

      );

    }
  );


  /* ==================================================
     CURRENT LIVE PRICE
  ================================================== */

  const live =
    candles[
      candles.length - 1
    ].close;


  const liveY =
    Y(live);


  /*
    Only show live line
    when viewing current area
  */

  if(panOffset === 0){

    ctx.strokeStyle =
      "#ffd54a";


    ctx.setLineDash(
      [5,5]
    );


    ctx.beginPath();

    ctx.moveTo(
      0,
      liveY
    );

    ctx.lineTo(
      chartWidth,
      liveY
    );

    ctx.stroke();


    ctx.setLineDash([]);


    /*
      Live price text
    */

    ctx.fillStyle =
      "#ffd54a";


    ctx.font =
      "bold 12px Arial";


    ctx.fillText(

      "$" +
      formatPrice(live),

      5,

      Math.max(
        15,
        liveY - 5
      )

    );

  }


  /* ==================================================
     RIGHT LIVE AREA
  ================================================== */

  ctx.strokeStyle =
    "#344a66";

  ctx.setLineDash(
    [3,5]
  );


  ctx.beginPath();

  ctx.moveTo(
    chartWidth,
    0
  );

  ctx.lineTo(
    chartWidth,
    H
  );

  ctx.stroke();


  ctx.setLineDash([]);


  /*
    LIVE marker
  */

  if(panOffset === 0){

    ctx.fillStyle =
      "#00d084";

    ctx.font =
      "bold 11px Arial";


    ctx.fillText(
      "LIVE",
      chartWidth + 12,
      20
    );

  }

}


/* ==================================================
   DRAG / PAN
================================================== */

let dragging = false;

let dragStartX = 0;

let dragStartOffset = 0;


/*
   Mouse / touch start
*/

canvas.addEventListener(
  "pointerdown",
  function(event){

    dragging = true;

    dragStartX =
      event.clientX;

    dragStartOffset =
      panOffset;


    canvas.classList.add(
      "dragging"
    );


    canvas.setPointerCapture(
      event.pointerId
    );

  }
);


/*
   Mouse / touch move
*/

canvas.addEventListener(
  "pointermove",
  function(event){

    if(!dragging){
      return;
    }


    const dx =
      event.clientX -
      dragStartX;


    /*
      Convert pixels
      to candles
    */

    const chartWidth =
      canvas.parentElement.clientWidth -
      RIGHT_SPACE;


    const step =
      chartWidth /
      VISIBLE_CANDLES;


    /*
      Drag left =
      older candles

      Drag right =
      newer candles
    */

    const movedCandles =
      -dx / step;


    panOffset =
      dragStartOffset +
      movedCandles;


    /*
      Limits
    */

    const maxPan =
      Math.max(
        0,
        candles.length -
        VISIBLE_CANDLES
      );


    panOffset =
      Math.max(
        0,
        Math.min(
          maxPan,
          panOffset
        )
      );


    draw();

  }
);


/*
   End drag
*/

function stopDrag(){

  dragging = false;

  canvas.classList.remove(
    "dragging"
  );

}


canvas.addEventListener(
  "pointerup",
  stopDrag
);

canvas.addEventListener(
  "pointercancel",
  stopDrag
);

canvas.addEventListener(
  "pointerleave",
  function(){

    /*
      Do not stop pointer capture
      unnecessarily.
    */

  }
);


/* ==================================================
   DOUBLE CLICK = LIVE
================================================== */

canvas.addEventListener(
  "dblclick",
  function(){

    goLive();

  }
);


/* ==================================================
   START
================================================== */

(async function(){

  await loadCandles();

  resizeCanvas();

  connect();

})();


/* ==================================================
   REDRAW
================================================== */

setInterval(
  function(){

    draw();

  },
  1000
);
/* ================================
   SUPERTREND ADD-ON
   Existing Live Candle code को
   छेड़े बिना
================================ */

const ST_ATR = 10;
const ST_MULT = 3.0;

const ST_SL = 0.50;
const ST_TP1 = 0.50;
const ST_TP2 = 1.00;
const ST_TP3 = 1.50;


/* ---------- ATR ---------- */

function stATR(i){

  if(i < ST_ATR) return null;

  let sum = 0;

  for(let x = i - ST_ATR + 1; x <= i; x++){

    const c = candles[x];
    const p = candles[x - 1];

    const tr = Math.max(
      c.high - c.low,
      Math.abs(c.high - p.close),
      Math.abs(c.low - p.close)
    );

    sum += tr;
  }

  return sum / ST_ATR;
}


/* ---------- SuperTrend ---------- */

function getST(){

  if(candles.length < ST_ATR + 2)
    return [];

  const out = [];

  let upperPrev = null;
  let lowerPrev = null;
  let trendPrev = 1;

  for(let i = 0; i < candles.length; i++){

    const atr = stATR(i);

    if(atr === null){

      out.push({
        value:null,
        trend:0
      });

      continue;
    }

    const c = candles[i];

    const mid =
      (c.high + c.low) / 2;

    let upper =
      mid + ST_MULT * atr;

    let lower =
      mid - ST_MULT * atr;


    if(
      upperPrev !== null &&
      candles[i-1].close <= upperPrev
    ){

      upper =
        Math.min(
          upper,
          upperPrev
        );
    }


    if(
      lowerPrev !== null &&
      candles[i-1].close >= lowerPrev
    ){

      lower =
        Math.max(
          lower,
          lowerPrev
        );
    }


    let trend = trendPrev;


    if(
      trendPrev === -1 &&
      c.close > upper
    ){

      trend = 1;

    }
    else if(
      trendPrev === 1 &&
      c.close < lower
    ){

      trend = -1;

    }


    out.push({

      value:
        trend === 1
          ? lower
          : upper,

      trend:trend

    });


    upperPrev = upper;
    lowerPrev = lower;
    trendPrev = trend;
  }

  return out;
}


/* ---------- Trading Levels ---------- */

function updateSTLevels(){

  if(candles.length < ST_ATR + 2)
    return;


  const st = getST();

  const last =
    st[st.length - 1];

  const previous =
    st[st.length - 2];


  const price =
    candles[
      candles.length - 1
    ].close;


  let signal = "WAIT";


  if(
    previous.trend === -1 &&
    last.trend === 1
  ){

    signal = "BUY";

  }
  else if(
    previous.trend === 1 &&
    last.trend === -1
  ){

    signal = "SELL";

  }


  const entry = price;

  let sl;
  let tp1;
  let tp2;
  let tp3;


  if(last.trend === 1){

    sl =
      entry *
      (1 - ST_SL / 100);

    tp1 =
      entry *
      (1 + ST_TP1 / 100);

    tp2 =
      entry *
      (1 + ST_TP2 / 100);

    tp3 =
      entry *
      (1 + ST_TP3 / 100);

  }
  else{

    sl =
      entry *
      (1 + ST_SL / 100);

    tp1 =
      entry *
      (1 - ST_TP1 / 100);

    tp2 =
      entry *
      (1 - ST_TP2 / 100);

    tp3 =
      entry *
      (1 - ST_TP3 / 100);

  }


  /*
     Agar ye IDs tumhare HTML me hain
     to values automatically dikhengi.
  */

  const trend =
    document.getElementById("trend");

  const signalBox =
    document.getElementById("signal");

  const entryBox =
    document.getElementById("entry");

  const slBox =
    document.getElementById("sl");

  const tp1Box =
    document.getElementById("tp1");

  const tp2Box =
    document.getElementById("tp2");

  const tp3Box =
    document.getElementById("tp3");

  const atrBox =
    document.getElementById("atr");


  if(trend){

    trend.textContent =
      last.trend === 1
        ? "BULLISH"
        : "BEARISH";

  }


  if(signalBox){

    signalBox.textContent =
      signal;

  }


  if(entryBox){

    entryBox.textContent =
      entry.toFixed(2);

  }


  if(slBox){

    slBox.textContent =
      sl.toFixed(2);

  }


  if(tp1Box){

    tp1Box.textContent =
      tp1.toFixed(2);

  }


  if(tp2Box){

    tp2Box.textContent =
      tp2.toFixed(2);

  }


  if(tp3Box){

    tp3Box.textContent =
      tp3.toFixed(2);

  }


  if(atrBox){

    const a =
      stATR(
        candles.length - 1
      );

    atrBox.textContent =
      a === null
        ? "--"
        : a.toFixed(2);

  }

}


/* ---------- Existing updateScreen ke
   baad SuperTrend update ---------- */

const oldUpdateScreen =
  window.updateScreen;

window.updateScreen =
  function(){

    if(
      typeof oldUpdateScreen ===
      "function"
    ){

      oldUpdateScreen();

    }

    updateSTLevels();

  };
</script>

</body>
  </html>
