<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sanjay Rana Trading Chart</title>

<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b0f14;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.topbar{
    height:55px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    background:#111820;
    border-bottom:1px solid #26313c;
    overflow-x:auto;
}

.title{
    font-size:18px;
    font-weight:bold;
    white-space:nowrap;
}

select,input,button{
    background:#18212b;
    color:#fff;
    border:1px solid #344250;
    border-radius:6px;
    padding:8px 10px;
}

button{
    cursor:pointer;
}

.alertBtn{
    background:#263442;
}

.alertOn{
    background:#087f3f;
}

.main{
    height:calc(100vh - 55px);
    display:flex;
    flex-direction:column;
}

.chartBox{
    position:relative;
    flex:1;
    min-height:0;
}

#chart{
    position:absolute;
    inset:0;
}

.signal{
    position:absolute;
    top:12px;
    left:12px;
    z-index:10;
    padding:9px 14px;
    border-radius:7px;
    font-weight:bold;
    background:#26313c;
}

.buy{
    background:#087f3f;
}

.sell{
    background:#a51e2a;
}

.panel{
    position:absolute;
    top:55px;
    left:12px;
    z-index:10;
    background:rgba(13,18,24,.94);
    border:1px solid #344250;
    border-radius:8px;
    padding:10px;
    width:185px;
}

.panel h3{
    margin:0 0 8px;
    font-size:14px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:7px 0;
    font-size:12px;
}

.row input{
    width:75px;
    padding:5px;
}

.status{
    position:absolute;
    right:12px;
    top:12px;
    z-index:10;
    background:rgba(13,18,24,.92);
    padding:8px 12px;
    border-radius:7px;
    font-size:12px;
}

@media(max-width:600px){
    .topbar{
        height:52px;
    }

    .title{
        font-size:15px;
    }

    .topbar select,
    .topbar button{
        padding:6px 8px;
        font-size:12px;
    }

    .panel{
        width:165px;
        top:48px;
    }
}
</style>
</head>

<body>

<div class="topbar">

    <div class="title">SANJAY RANA</div>

    <select id="symbol">
        <option value="BTCUSDT">BTC/USDT</option>
    </select>

    <select id="timeframe">
        <option value="1m">1m</option>
        <option value="5m" selected>5m</option>
        <option value="15m">15m</option>
        <option value="1h">1H</option>
    </select>

    <button id="alertBtn" class="alertBtn">
        🔔 Alert OFF
    </button>

</div>

<div class="main">

<div class="chartBox">

    <div id="chart"></div>

    <div id="signalBox" class="signal">
        SIGNAL: WAIT
    </div>

    <div id="status" class="status">
        Connecting...
    </div>

    <div class="panel">

        <h3>SuperTrend / Target</h3>

        <div class="row">
            <span>ATR Period</span>
            <input id="atrPeriod" type="number" value="10">
        </div>

        <div class="row">
            <span>Multiplier</span>
            <input id="multiplier" type="number" value="3" step="0.1">
        </div>

        <div class="row">
            <span>TP1</span>
            <input id="tp1" type="number" value="300">
        </div>

        <div class="row">
            <span>TP2</span>
            <input id="tp2" type="number" value="600">
        </div>

        <div class="row">
            <span>TP3</span>
            <input id="tp3" type="number" value="900">
        </div>

        <div class="row">
            <span>SL</span>
            <input id="sl" type="number" value="200">
        </div>

        <div class="row">
            <span>Trail Step</span>
            <input id="trail" type="number" value="100">
        </div>

    </div>

</div>

</div>

<script>

const chart = LightweightCharts.createChart(
    document.getElementById("chart"),
    {
        layout:{
            background:{color:"#0b0f14"},
            textColor:"#b8c2cc"
        },

        grid:{
            vertLines:{color:"#17202a"},
            horzLines:{color:"#17202a"}
        },

        rightPriceScale:{
            borderColor:"#26313c"
        },

        timeScale:{
            borderColor:"#26313c",
            timeVisible:true,
            secondsVisible:false
        },

        crosshair:{
            mode:LightweightCharts.CrosshairMode.Normal
        }
    }
);

const candleSeries = chart.addCandlestickSeries({
    upColor:"#00c176",
    downColor:"#ef4444",
    borderUpColor:"#00c176",
    borderDownColor:"#ef4444",
    wickUpColor:"#00c176",
    wickDownColor:"#ef4444"
});

const stSeries = chart.addLineSeries({
    lineWidth:2,
    priceLineVisible:false,
    lastValueVisible:true
});

const tp1Series = chart.addLineSeries({
    color:"#35d07f",
    lineWidth:1,
    priceLineVisible:false
});

const tp2Series = chart.addLineSeries({
    color:"#20b968",
    lineWidth:1,
    priceLineVisible:false
});

const tp3Series = chart.addLineSeries({
    color:"#00ff80",
    lineWidth:2,
    priceLineVisible:false
});

const slSeries = chart.addLineSeries({
    color:"#ff3030",
    lineWidth:2,
    priceLineVisible:false
});

let candles=[];
let trend=1;
let previousTrend=1;

let currentSignal="WAIT";
let entryPrice=null;
let currentSide=0;

let alertEnabled=false;
let audioContext=null;

const statusBox=document.getElementById("status");
const signalBox=document.getElementById("signalBox");
const alertBtn=document.getElementById("alertBtn");

function timeframeSeconds(tf){

    if(tf==="1m") return 60;
    if(tf==="5m") return 300;
    if(tf==="15m") return 900;
    if(tf==="1h") return 3600;

    return 300;
}

function interval(){

    return document.getElementById("timeframe").value;
}

function apiInterval(){

    return interval();
}

async function loadHistory(){

    try{

        statusBox.innerText="Loading...";

        const symbol=document.getElementById("symbol").value;

        const url=
        "https://api.binance.com/api/v3/klines"+
        "?symbol="+symbol+
        "&interval="+apiInterval()+
        "&limit=500";

        const response=await fetch(url);

        const data=await response.json();

        candles=data.map(x=>({

            time:Math.floor(x[0]/1000),
            open:Number(x[1]),
            high:Number(x[2]),
            low:Number(x[3]),
            close:Number(x[4])

        }));

        candleSeries.setData(candles);

        calculateSuperTrend();

        chart.timeScale().fitContent();

        statusBox.innerText="LIVE";

    }catch(error){

        console.error(error);

        statusBox.innerText="Connection Error";

    }

}

function calculateATR(data,period){

    if(data.length<period+1)
        return [];

    let tr=[];

    for(let i=0;i<data.length;i++){

        if(i===0){

            tr.push(
                data[i].high-data[i].low
            );

        }else{

            const h=data[i].high;
            const l=data[i].low;
            const pc=data[i-1].close;

            tr.push(
                Math.max(
                    h-l,
                    Math.abs(h-pc),
                    Math.abs(l-pc)
                )
            );

        }

    }

    let atr=[];

    for(let i=0;i<tr.length;i++){

        if(i<period-1){

            atr.push(null);

        }else{

            let sum=0;

            for(
                let j=i-period+1;
                j<=i;
                j++
            ){
                sum+=tr[j];
            }

            atr.push(sum/period);

        }

    }

    return atr;
}

function calculateSuperTrend(){

    if(candles.length<20)
        return;

    const period=
        Number(document.getElementById("atrPeriod").value)||10;

    const multiplier=
        Number(document.getElementById("multiplier").value)||3;

    const atr=calculateATR(candles,period);

    let upper=[];
    let lower=[];
    let st=[];
    let direction=[];

    let dir=1;

    for(let i=0;i<candles.length;i++){

        if(atr[i]===null){

            upper.push(null);
            lower.push(null);
            st.push(null);
            direction.push(dir);

            continue;
        }

        const hl2=
            (candles[i].high+candles[i].low)/2;

        let basicUpper=
            hl2+(multiplier*atr[i]);

        let basicLower=
            hl2-(multiplier*atr[i]);

        if(i>0 && upper[i-1]!==null){

            if(
                basicUpper>upper[i-1] &&
                candles[i-1].close<=upper[i-1]
            ){
                basicUpper=upper[i-1];
            }

            if(
                basicLower<lower[i-1] &&
                candles[i-1].close>=lower[i-1]
            ){
                basicLower=lower[i-1];
            }

        }

        upper.push(basicUpper);
        lower.push(basicLower);

        if(i===period-1){

            dir=
                candles[i].close>=basicUpper
                ?1:-1;

        }else{

            if(
                dir===-1 &&
                candles[i].close>upper[i-1]
            ){
                dir=1;
            }

            else if(
                dir===1 &&
                candles[i].close<lower[i-1]
            ){
                dir=-1;
            }

        }

        direction.push(dir);

        st.push(
            dir===1
            ?basicLower
            :basicUpper
        );

    }

    trend=direction[direction.length-1];

    let stData=[];

    for(let i=0;i<candles.length;i++){

        if(st[i]!==null){

            stData.push({

                time:candles[i].time,
                value:st[i]

            });

        }

    }

    stSeries.setData(stData);

    detectSignal(direction,st);

}

function detectSignal(direction,st){

    if(direction.length<2)
        return;

    const last=
        direction[direction.length-1];

    const prev=
        direction[direction.length-2];

    if(
        last===1 &&
        prev===-1
    ){

        generateSignal(
            "BUY",
            candles[candles.length-1].close
        );

    }

    else if(
        last===-1 &&
        prev===1
    ){

        generateSignal(
            "SELL",
            candles[candles.length-1].close
        );

    }

    else{

        updateSignalDisplay();

    }

}

function generateSignal(side,price){

    currentSignal=side;

    currentSide=
        side==="BUY"
        ?1:-1;

    entryPrice=price;

    signalBox.innerText=
        "SIGNAL: "+side+
        " @ "+price.toFixed(2);

    signalBox.className=
        "signal "+
        (side==="BUY"?"buy":"sell");

    updateTargetLines();

    if(alertEnabled){

        playAlert(side);

    }

}

function updateSignalDisplay(){

    if(currentSignal==="WAIT"){

        signalBox.innerText="SIGNAL: WAIT";

        signalBox.className="signal";

    }

}

function updateTargetLines(){

    if(!entryPrice)
        return;

    const tp1=
        Number(document.getElementById("tp1").value);

    const tp2=
        Number(document.getElementById("tp2").value);

    const tp3=
        Number(document.getElementById("tp3").value);

    const sl=
        Number(document.getElementById("sl").value);

    let p1,p2,p3,s;

    if(currentSide===1){

        p1=entryPrice+tp1;
        p2=entryPrice+tp2;
        p3=entryPrice+tp3;
        s=entryPrice-sl;

    }else{

        p1=entryPrice-tp1;
        p2=entryPrice-tp2;
        p3=entryPrice-tp3;
        s=entryPrice+sl;

    }

    const firstTime=
        candles.length
        ?candles[Math.max(0,candles.length-100)].time
        :0;

    const lastTime=
        candles.length
        ?candles[candles.length-1].time
        :0;

    tp1Series.setData([
        {time:firstTime,value:p1},
        {time:lastTime,value:p1}
    ]);

    tp2Series.setData([
        {time:firstTime,value:p2},
        {time:lastTime,value:p2}
    ]);

    tp3Series.setData([
        {time:firstTime,value:p3},
        {time:lastTime,value:p3}
    ]);

    slSeries.setData([
        {time:firstTime,value:s},
        {time:lastTime,value:s}
    ]);

}

function playAlert(side){

    try{

        if(!audioContext){

            audioContext=
                new (window.AudioContext ||
                window.webkitAudioContext)();

        }

        const oscillator=
            audioContext.createOscillator();

        const gain=
            audioContext.createGain();

        oscillator.type="sine";

        oscillator.frequency.value=
            side==="BUY"
            ?880
            :440;

        gain.gain.value=0.18;

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        setTimeout(()=>{

            oscillator.stop();

        },500);

    }catch(e){

        console.log(e);

    }

}

alertBtn.onclick=async()=>{

    alertEnabled=!alertEnabled;

    if(alertEnabled){

        try{

            audioContext=
                new (window.AudioContext ||
                window.webkitAudioContext)();

            await audioContext.resume();

        }catch(e){}

        alertBtn.innerText="🔔 Alert ON";

        alertBtn.classList.add("alertOn");

    }else{

        alertBtn.innerText="🔕 Alert OFF";

        alertBtn.classList.remove("alertOn");

    }

};

document
.getElementById("timeframe")
.addEventListener("change",()=>{

    candles=[];

    loadHistory();

});

document
.getElementById("atrPeriod")
.addEventListener("change",calculateSuperTrend);

document
.getElementById("multiplier")
.addEventListener("change",calculateSuperTrend);

[
    "tp1",
    "tp2",
    "tp3",
    "sl"
].forEach(id=>{

    document
    .getElementById(id)
    .addEventListener(
        "change",
        updateTargetLines
    );

});

window.addEventListener(
    "resize",
    ()=>{
        chart.applyOptions({
            width:document
            .getElementById("chart")
            .clientWidth,

            height:document
            .getElementById("chart")
            .clientHeight
        });
    }
);

let ws=null;

function startWebSocket(){

    if(ws){

        try{
            ws.close();
        }catch(e){}

    }

    const symbol=
        document.getElementById("symbol")
        .value.toLowerCase();

    const stream=
        symbol+
        "@kline_"+
        apiInterval();

    ws=new WebSocket(
        "wss://stream.binance.com:9443/ws/"+stream
    );

    ws.onopen=()=>{

        statusBox.innerText="LIVE";

    };

    ws.onmessage=(event)=>{

        const data=
            JSON.parse(event.data);

        const k=data.k;

        const candle={

            time:Math.floor(k.t/1000),

            open:Number(k.o),
            high:Number(k.h),
            low:Number(k.l),
            close:Number(k.c)

        };

        const last=
            candles[candles.length-1];

        if(
            last &&
            last.time===candle.time
        ){

            candles[candles.length-1]=candle;

        }else{

            candles.push(candle);

            if(candles.length>500)
                candles.shift();

        }

        candleSeries.update(candle);

        calculateSuperTrend();

        if(entryPrice)
            updateTargetLines();

    };

    ws.onerror=()=>{

        statusBox.innerText="WebSocket Error";

    };

    ws.onclose=()=>{

        statusBox.innerText="Disconnected";

        setTimeout(startWebSocket,3000);

    };

}

loadHistory();

startWebSocket();

</script>

</body>
</html>
