<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All-In-One Pro Trading Dashboard Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #121824; color: #d1d4dc; padding: 12px; }
    
    /* 1. TOP SECTION: FULL WIDTH CHART CANVAS */
    #chart-wrapper {
      width: 100%;
      height: 60vh;
      background-color: #1a1e29;
      border-radius: 8px;
      border: 1px solid #2a2e39;
      position: relative;
      margin-bottom: 15px;
      overflow: hidden;
    }
    #chart-container { width: 100%; height: 100%; min-height: 350px; }

    /* 2. BOTTOM SECTION: SEPARATE STAMPS GRID */
    .stamps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .stamp-card {
      background-color: #1e222d;
      border-radius: 8px;
      border: 1px solid #2a2e39;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .stamp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2e39;
      padding-bottom: 6px;
      font-size: 12px;
      font-weight: bold;
      color: #2962ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, button, input {
      background-color: #2a2e39; color: #d1d4dc; border: 1px solid #363c4e;
      padding: 8px 10px; border-radius: 4px; font-weight: 600; font-size: 12px; cursor: pointer; transition: 0.2s;
    }
    select:focus, button:focus, input:focus { outline: none; border-color: #2962ff; }
    button.active { background-color: #2962ff; color: #fff; border-color: #2962ff; }
    button:hover { background-color: #363c4e; }
    
    .tf-btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .data-row { display: flex; justify-content: space-between; font-size: 13px; color: #b2b5be; }
    .data-row span:last-child { color: #d1d4dc; font-weight: 600; }

    .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-buy { background: rgba(38, 166, 154, 0.2); color: #26a69a; }
    .badge-sell { background: rgba(239, 83, 80, 0.2); color: #ef5350; }

    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #ef5350; margin-right: 5px; }
    .status-dot.online { background-color: #26a69a; }
  </style>
</head>
<body>

  <div id="chart-wrapper">
    <div id="chart-container"></div>
  </div>

  <div class="stamps-grid">
    
    <div class="stamp-card">
      <div class="stamp-header">
        <span>STAMP 1: Market & Supertrend Config</span>
        <div><span class="status-dot" id="wsDot"></span><span id="wsStatus" style="font-size:10px; color:#aaa;">Init</span></div>
      </div>
      
      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:11px; color:#888;">Select Asset:</label>
        <select id="marketSelect" onchange="changeMarket(this.value)">
          <option value="BTCUSDT">BTC/USDT (Binance Live)</option>
          <option value="ETHUSDT">ETH/USDT (Binance Live)</option>
        </select>

        <div style="display:flex; gap:8px; margin-top:2px;">
          <div>
            <label style="font-size:10px; color:#888;">ATR Period:</label>
            <input type="number" id="atrPeriod" value="10" style="width:100%;" onchange="loadChartData()">
          </div>
          <div>
            <label style="font-size:10px; color:#888;">Multiplier:</label>
            <input type="number" id="atrMult" value="3.0" step="0.1" style="width:100%;" onchange="loadChartData()">
          </div>
        </div>

        <label style="font-size:11px; color:#888; margin-top:4px;">Timeframe:</label>
        <div class="tf-btn-group">
          <button onclick="changeTimeframe('1m')" class="tf-btn">1m</button>
          <button onclick="changeTimeframe('5m')" class="tf-btn active">5m</button>
          <button onclick="changeTimeframe('15m')" class="tf-btn">15m</button>
          <button onclick="changeTimeframe('1h')" class="tf-btn">1h</button>
          <button onclick="changeTimeframe('1d')" class="tf-btn">1D</button>
        </div>
      </div>
    </div>

    <div class="stamp-card">
      <div class="stamp-header">
        <span>STAMP 2: Signal & Dynamic Targets</span>
        <span id="sigBadge" class="badge badge-buy">BUY</span>
      </div>
      
      <div class="data-row"><span>Symbol:</span><span id="sigSymbol">BTCUSDT</span></div>
      <div class="data-row"><span>Entry Price (EP):</span><span id="sigEP">--</span></div>
      <div class="data-row"><span>Stop Loss (SL):</span><span id="sigSL" style="color:#ef5350;">--</span></div>
      <div class="data-row"><span>Target 1 (1:1):</span><span id="sigTP1" style="color:#26a69a;">--</span></div>
      <div class="data-row"><span>Target 2 (1:2):</span><span id="sigTP2" style="color:#26a69a;">--</span></div>
      <div class="data-row"><span>Target 3 (1:3):</span><span id="sigTP3" style="color:#26a69a;">--</span></div>
    </div>

    <div class="stamp-card">
      <div class="stamp-header">
        <span>STAMP 3: Candle Close Instant WhatsApp Alert</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <input type="text" id="phoneNum" placeholder="Mobile (+91...)" value="+919876543210">
        <input type="text" id="webhookUrl" placeholder="Webhook API URL" value="http://localhost:5000/send-whatsapp">
        <button onclick="triggerAlert('Manual Test Alert')" style="background:#26a69a; color:#fff; font-weight:bold; margin-top:4px;">Test Direct Alert</button>
      </div>
    </div>

    <div class="stamp-card">
      <div class="stamp-header">
        <span>STAMP 4: Ticker & Candle Close Feed</span>
      </div>
      <div id="tickerLog" style="font-family: monospace; font-size:11px; color:#26a69a; background:#131722; padding:8px; border-radius:4px; height:100%; display:flex; flex-direction:column; justify-content:center;">
        Connecting live stream...
      </div>
    </div>

  </div>

  <script>
    let chart, candleSeries, supertrendSeries;
    let wsSocket = null;
    let currentSymbol = 'BTCUSDT';
    let currentTimeframe = '5m';
    let rawCandles = [];
    let previousTrend = null;

    const tfSecondsMap = { '1m': 60, '5m': 300, '15m': 900, '1h': 3600, '1d': 86400 };

    function initChart() {
      const container = document.getElementById('chart-container');
      
      // Fallback check for Library Load
      if (typeof LightweightCharts === 'undefined') {
        console.error("TradingView Library not loaded yet");
        setTimeout(initChart, 500);
        return;
      }

      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: { backgroundColor: '#1a1e29', textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#242b3b' }, horzLines: { color: '#242b3b' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        priceScale: { borderColor: '#2a2e39' },
        timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false }
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderUpColor: '#26a69a', borderDownColor: '#ef5350',
        wickUpColor: '#26a69a', wickDownColor: '#ef5350'
      });

      supertrendSeries = chart.addLineSeries({
        color: '#26a69a', lineWidth: 2, crosshairMarkerVisible: false
      });

      window.addEventListener('resize', () => {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      });

      loadChartData();
    }

    function calculateSupertrend(candles, period, multiplier) {
      if (candles.length < period) return [];

      let stResult = [];
      let atr = [];
      let upperBand = [];
      let lowerBand = [];
      let inUpTrend = true;

      for (let i = 0; i < candles.length; i++) {
        if (i === 0) {
          atr.push(candles[i].high - candles[i].low);
        } else {
          let tr0 = candles[i].high - candles[i].low;
          let tr1 = Math.abs(candles[i].high - candles[i - 1].close);
          let tr2 = Math.abs(candles[i].low - candles[i - 1].close);
          let tr = Math.max(tr0, tr1, tr2);
          
          if (i < period) {
            atr.push(tr);
          } else {
            let prevAtr = atr[i - 1];
            atr.push((prevAtr * (period - 1) + tr) / period);
          }
        }
      }

      for (let i = 0; i < candles.length; i++) {
        let hl2 = (candles[i].high + candles[i].low) / 2;
        let basicUpper = hl2 + (multiplier * atr[i]);
        let basicLower = hl2 - (multiplier * atr[i]);

        if (i === 0) {
          upperBand.push(basicUpper);
          lowerBand.push(basicLower);
          stResult.push({ time: candles[i].time, value: basicLower, isUp: true });
          continue;
        }

        let prevUpper = upperBand[i - 1];
        let prevLower = lowerBand[i - 1];
        let prevClose = candles[i - 1].close;

        let finalUpper = (basicUpper < prevUpper || prevClose > prevUpper) ? basicUpper : prevUpper;
        let finalLower = (basicLower > prevLower || prevClose < prevLower) ? basicLower : prevLower;

        upperBand.push(finalUpper);
        lowerBand.push(finalLower);

        if (inUpTrend) {
          if (candles[i].close < finalLower) {
            inUpTrend = false;
            stResult.push({ time: candles[i].time, value: finalUpper, isUp: false });
          } else {
            stResult.push({ time: candles[i].time, value: finalLower, isUp: true });
          }
        } else {
          if (candles[i].close > finalUpper) {
            inUpTrend = true;
            stResult.push({ time: candles[i].time, value: finalLower, isUp: true });
          } else {
            stResult.push({ time: candles[i].time, value: finalUpper, isUp: false });
          }
        }
      }

      return stResult;
    }

    function loadChartData() {
      const step = tfSecondsMap[currentTimeframe] || 300;
      rawCandles = [];
      let currentTime = Math.floor(Date.now() / 1000) - (120 * step);
      let price = currentSymbol === 'ETHUSDT' ? 3200 : 65000;

      for (let i = 0; i < 120; i++) {
        let time = currentTime + (i * step);
        let open = price + (Math.random() - 0.49) * (price * 0.002);
        let high = open + Math.random() * (price * 0.003);
        let low = open - Math.random() * (price * 0.003);
        let close = (high + low) / 2;
        price = close;

        rawCandles.push({ time, open, high, low, close });
      }

      candleSeries.setData(rawCandles);
      
      const p = parseInt(document.getElementById('atrPeriod').value) || 10;
      const m = parseFloat(document.getElementById('atrMult').value) || 3.0;
      
      const stData = calculateSupertrend(rawCandles, p, m);
      supertrendSeries.setData(stData.map(d => ({ time: d.time, value: d.value })));
      
      chart.timeScale().fitContent();

      if (stData.length > 0) {
        let lastSt = stData[stData.length - 1];
        let lastCandle = rawCandles[rawCandles.length - 1];
        previousTrend = lastSt.isUp ? 'BUY' : 'SELL';
        updateStampData(lastCandle.close, lastSt.value, lastSt.isUp);
      }

      connectWebSocket();
    }

    function connectWebSocket() {
      if(wsSocket) wsSocket.close();

      const streamSymbol = currentSymbol.toLowerCase();
      const url = `wss://stream.binance.com:9443/ws/${streamSymbol}@kline_${currentTimeframe}`;
      
      wsSocket = new WebSocket(url);

      wsSocket.onopen = () => {
        document.getElementById('wsDot').className = 'status-dot online';
        document.getElementById('wsStatus').innerText = 'Live Stream';
      };

      wsSocket.onmessage = (e) => {
        const data = JSON.parse(e.data);
        const k = data.k;
        
        const candle = {
          time: Math.floor(k.t / 1000),
          open: parseFloat(k.o),
          high: parseFloat(k.h),
          low: parseFloat(k.l),
          close: parseFloat(k.c)
        };

        const isCandleClosed = k.x;

        let lastIdx = rawCandles.length - 1;
        if (rawCandles[lastIdx].time === candle.time) {
          rawCandles[lastIdx] = candle;
        } else {
          rawCandles.push(candle);
        }

        candleSeries.update(candle);

        const p = parseInt(document.getElementById('atrPeriod').value) || 10;
        const m = parseFloat(document.getElementById('atrMult').value) || 3.0;
        const stData = calculateSupertrend(rawCandles, p, m);
        let currentSt = stData[stData.length - 1];

        supertrendSeries.update({ time: candle.time, value: currentSt.value });

        document.getElementById('tickerLog').innerHTML = `
          <div>[${new Date().toLocaleTimeString()}] ${currentSymbol}: $${candle.close.toFixed(2)}</div>
          <div style="color:${isCandleClosed ? '#26a69a' : '#ef5350'}; margin-top:3px;">
            Status: ${isCandleClosed ? 'CLOSED (Evaluated)' : 'BUILDING...'} | ST: ${currentSt.isUp ? 'BUY' : 'SELL'}
          </div>
        `;
        
        updateStampData(candle.close, currentSt.value, currentSt.isUp);

        if (isCandleClosed) {
          const currentTrend = currentSt.isUp ? 'BUY' : 'SELL';
          if (previousTrend !== currentTrend) {
            previousTrend = currentTrend;
            triggerAlert(`SUPERTREND SHIFTED TO ${currentTrend}`);
          }
        }
      };

      wsSocket.onclose = () => {
        document.getElementById('wsDot').className = 'status-dot';
        document.getElementById('wsStatus').innerText = 'Offline';
      };
    }

    function updateStampData(entry, supertrendVal, isUp) {
      const risk = Math.abs(entry - supertrendVal);
      const tp1 = isUp ? entry + risk : entry - risk;
      const tp2 = isUp ? entry + (risk * 2) : entry - (risk * 2);
      const tp3 = isUp ? entry + (risk * 3) : entry - (risk * 3);

      document.getElementById('sigSymbol').innerText = currentSymbol;
      document.getElementById('sigBadge').innerText = isUp ? 'BUY' : 'SELL';
      document.getElementById('sigBadge').className = isUp ? 'badge badge-buy' : 'badge badge-sell';

      document.getElementById('sigEP').innerText = entry.toFixed(2);
      document.getElementById('sigSL').innerText = supertrendVal.toFixed(2);
      document.getElementById('sigTP1').innerText = tp1.toFixed(2);
      document.getElementById('sigTP2').innerText = tp2.toFixed(2);
      document.getElementById('sigTP3').innerText = tp3.toFixed(2);
    }

    function triggerAlert(alertType = "Candle Close Instant Alert") {
      const phone = document.getElementById('phoneNum').value;
      const url = document.getElementById('webhookUrl').value;
      const ep = document.getElementById('sigEP').innerText;
      const sl = document.getElementById('sigSL').innerText;
      const tp1 = document.getElementById('sigTP1').innerText;
      const badge = document.getElementById('sigBadge').innerText;

      const payload = {
        receiver: phone,
        symbol: currentSymbol,
        timeframe: currentTimeframe,
        signal: badge,
        entryPrice: ep,
        stopLoss: sl,
        target1: tp1,
        timestamp: new Date().toISOString()
      };

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => console.log("Backend offline, alert payload logged"));

      alert(`🚨 INSTANT WHATSAPP ALERT SENT!\nReason: ${alertType}\n\nSymbol: ${currentSymbol} (${currentTimeframe})\nSignal: ${badge}\nEP: ${ep} | SL (ST): ${sl} | TP1: ${tp1}`);
    }

    function changeMarket(symbol) { currentSymbol = symbol; loadChartData(); }
    function changeTimeframe(tf) {
      currentTimeframe = tf;
      document.querySelectorAll('.tf-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase() === tf.toLowerCase());
      });
      loadChartData();
    }

    window.onload = initChart;
  </script>
</body>
    </html>
