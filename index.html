<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradingView Pro Real Chart Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #121824; color: #d1d4dc; padding: 12px; }
    
    /* TOP SECTION: EXACT TRADINGVIEW CHART CONTAINER */
    #chart-wrapper {
      width: 100%;
      height: 65vh;
      background-color: #1a1e29;
      border-radius: 8px;
      border: 1px solid #2a2e39;
      position: relative;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .tradingview-widget-container { width: 100%; height: 100%; }

    /* BOTTOM SECTION: STAMPS GRID */
    .stamps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .stamp-card {
      background-color: #1e222d;
      border-radius: 8px;
      border: 1px solid #2a2e39;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .stamp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2e39;
      padding-bottom: 6px;
      font-size: 12px;
      font-weight: bold;
      color: #2962ff;
      text-transform: uppercase;
    }

    select, button, input {
      background-color: #2a2e39; color: #d1d4dc; border: 1px solid #363c4e;
      padding: 8px 10px; border-radius: 4px; font-weight: 600; font-size: 12px; cursor: pointer;
    }
    button:hover { background-color: #363c4e; }

    .data-row { display: flex; justify-content: space-between; font-size: 13px; color: #b2b5be; }
    .data-row span:last-child { color: #d1d4dc; font-weight: 600; }

    .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-buy { background: rgba(38, 166, 154, 0.2); color: #26a69a; }
  </style>
</head>
<body>

  <!-- TOP FULL TRADINGVIEW REAL CHART -->
  <div id="chart-wrapper">
    <div class="tradingview-widget-container">
      <div id="tradingview_advanced_chart" style="height:100%; width:100%;"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
      <script type="text/javascript">
        let tvWidget;

        function loadTradingViewChart(symbol = "BINANCE:BTCUSDT") {
          tvWidget = new TradingView.widget({
            "autosize": true,
            "symbol": symbol,
            "interval": "5",
            "timezone": "Asia/Kolkata",
            "theme": "dark",
            "style": "1",
            "locale": "in",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_advanced_chart",
            "hide_side_toolbar": false,
            "studies": [
              "STD;Supertrend"
            ]
          });
        }

        // Initial Load
        loadTradingViewChart("BINANCE:BTCUSDT");
      </script>
    </div>
  </div>

  <!-- BOTTOM STAMPS -->
  <div class="stamps-grid">
    
    <!-- STAMP 1: ASSET CHANGE -->
    <div class="stamp-card">
      <div class="stamp-header">
        <span>STAMP 1: Market Selector</span>
      </div>
      <label style="font-size:11px; color:#888;">Select Symbol for Chart:</label>
      <select id="marketSelect" onchange="changeTvSymbol(this.value)">
        <option value="BINANCE:BTCUSDT">BTC/USDT (Binance)</option>
        <option value="BINANCE:ETHUSDT">ETH/USDT (Binance)</option>
        <option value="NSE:NIFTY">NIFTY 50 (NSE)</option>
        <option value="NSE:BANKNIFTY">BANKNIFTY (NSE)</option>
      </select>
    </div>

    <!-- STAMP 2: SIGNAL TARGETS -->
    <div class="stamp-card">
      <div class="stamp-header">
        <span>STAMP 2: Active Trade Signal</span>
        <span class="badge badge-buy">BUY</span>
      </div>
      <div class="data-row"><span>Selected Asset:</span><span id="sigSymbol">BINANCE:BTCUSDT</span></div>
      <div class="data-row"><span>Supertrend Indicator:</span><span style="color:#26a69a;">Built-in TV Active</span></div>
      <div class="data-row"><span>Drawing Tools:</span><span>Left Toolbar Active</span></div>
    </div>

    <!-- STAMP 3: WHATSAPP ALERT -->
    <div class="stamp-card">
      <div class="stamp-header">
        <span>STAMP 3: Instant WhatsApp Alert</span>
      </div>
      <input type="text" id="phoneNum" placeholder="Mobile (+91...)" value="+919876543210">
      <button onclick="sendAlert()" style="background:#26a69a; color:#fff; font-weight:bold;">Test Alert Trigger</button>
    </div>

  </div>

  <script>
    function changeTvSymbol(symbol) {
      document.getElementById('sigSymbol').innerText = symbol;
      loadTradingViewChart(symbol);
    }

    function sendAlert() {
      const symbol = document.getElementById('marketSelect').value;
      const phone = document.getElementById('phoneNum').value;
      alert(`🚨 WHATSAPP ALERT SENT!\n\nSymbol: ${symbol}\nMobile: ${phone}\nStatus: Signal Alert Triggered!`);
    }
  </script>
</body>
  </html>
