<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BTC USDT Live Chart</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#07111d;
  color:white;
  font-family:Arial,sans-serif;
}

.header{
  padding:12px;
  background:#0d1928;
  border-bottom:1px solid #26384f;
}

.symbol{
  font-size:14px;
  color:#9eacbd;
}

.price{
  font-size:28px;
  font-weight:bold;
  margin-top:4px;
}

.status{
  margin-top:5px;
  font-size:13px;
  color:#ffd54a;
}

.controls{
  padding:10px;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  background:#091523;
}

button,select{
  background:#17283e;
  color:white;
  border:1px solid #38506d;
  border-radius:7px;
  padding:9px 12px;
}

.chart{
  margin:10px;
  height:520px;
  background:#0b1726;
  border:1px solid #26384f;
  border-radius:10px;
  overflow:hidden;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

.info{
  margin:10px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.box{
  background:#122238;
  border-radius:7px;
  padding:9px;
}

.box small{
  color:#9eacbd;
}

.box b{
  display:block;
  margin-top:4px;
}

@media(max-width:700px){

  .chart{
    height:430px;
  }

  .info{
    grid-template-columns:repeat(2,1fr);
  }

}

</style>
</head>


<body>


<!-- HEADER -->

<div class="header">

  <div class="symbol">
    BINANCE • BTC/USDT
  </div>

  <div id="price" class="price">
    $--
  </div>

  <div id="status" class="status">
    Starting...
  </div>

</div>


<!-- TIMEFRAME -->

<div class="controls">

  <button onclick="changeTF('1m')">
    1M
  </button>

  <button onclick="changeTF('5m')">
    5M
  </button>

  <button onclick="changeTF('15m')">
    15M
  </button>

  <button onclick="changeTF('30m')">
    30M
  </button>

  <button onclick="changeTF('1h')">
    1H
  </button>

  <button onclick="restart()">
    Refresh
  </button>

</div>


<!-- CHART -->

<div class="chart">

  <canvas id="chart"></canvas>

</div>


<!-- CANDLE DATA -->

<div class="info">

  <div class="box">
    <small>OPEN</small>
    <b id="open">--</b>
  </div>

  <div class="box">
    <small>HIGH</small>
    <b id="high">--</b>
  </div>

  <div class="box">
    <small>LOW</small>
    <b id="low">--</b>
  </div>

  <div class="box">
    <small>CLOSE</small>
    <b id="close">--</b>
  </div>

  <div class="box">
    <small>TIMEFRAME</small>
    <b id="tf">1M</b>
  </div>

  <div class="box">
    <small>CANDLES</small>
    <b id="count">0</b>
  </div>

</div>


<script>

"use strict";


/* =========================
   SETTINGS
========================= */

const SYMBOL = "BTCUSDT";

let timeframe = "1m";

let candles = [];

let socket = null;

let reconnectTimer = null;


/* =========================
   ELEMENT
========================= */

const canvas =
  document.getElementById("chart");

const ctx =
  canvas.getContext("2d");


function $(id){

  return document.getElementById(id);

}


/* =========================
   PRICE FORMAT
========================= */

function formatPrice(value){

  if(!Number.isFinite(value))
    return "--";

  return Number(value).toLocaleString(
    "en-US",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


/* =========================
   STATUS
========================= */

function status(text){

  $("status").textContent = text;

}


/* =========================
   LOAD OLD CANDLES
========================= */

async function loadCandles(){

  try{

    status("Loading candles...");


    const url =
      "https://api.binance.com/api/v3/klines" +
      "?symbol=" + SYMBOL +
      "&interval=" + timeframe +
      "&limit=100";


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    candles =
      data.map(function(k){

        return {

          time:Number(k[0]),

          open:Number(k[1]),

          high:Number(k[2]),

          low:Number(k[3]),

          close:Number(k[4]),

          volume:Number(k[5])

        };

      });


    updateScreen();

    draw();


    status(
      "Historical candles loaded"
    );

  }
  catch(error){

    console.error(error);

    status(
      "History error: " +
      error.message
    );

  }

}


/* =========================
   LIVE WEBSOCKET
========================= */

function connect(){

  if(socket){

    try{
      socket.close();
    }
    catch(e){}

  }


  clearTimeout(
    reconnectTimer
  );


  status(
    "Connecting live..."
  );


  /*
    Binance public WebSocket
  */

  const stream =
    SYMBOL.toLowerCase() +
    "@kline_" +
    timeframe;


  const url =
    "wss://stream.binance.com:9443/ws/" +
    stream;


  socket =
    new WebSocket(url);


  socket.onopen =
    function(){

      status(
        "🟢 LIVE • BTC/USDT"
      );

    };


  socket.onmessage =
    function(event){

      try{

        const message =
          JSON.parse(event.data);


        if(!message.k)
          return;


        const k =
          message.k;


        /*
          Current LIVE candle
        */

        const candle = {

          time:Number(k.t),

          open:Number(k.o),

          high:Number(k.h),

          low:Number(k.l),

          close:Number(k.c),

          volume:Number(k.v)

        };


        /*
          Current candle
          replace/update
        */

        const last =
          candles[candles.length - 1];


        if(
          !last ||
          last.time !== candle.time
        ){

          candles.push(
            candle
          );


          if(candles.length > 100){

            candles.shift();

          }

        }
        else{

          candles[
            candles.length - 1
          ] = candle;

        }


        /*
          Update screen immediately
        */

        updateScreen();

        draw();

      }
      catch(error){

        console.error(
          error
        );

      }

    };


  socket.onerror =
    function(){

      status(
        "⚠️ Connection error"
      );

    };


  socket.onclose =
    function(){

      status(
        "Reconnecting..."
      );


      reconnectTimer =
        setTimeout(
          connect,
          3000
        );

    };

}


/* =========================
   SCREEN
========================= */

function updateScreen(){

  if(candles.length === 0)
    return;


  const c =
    candles[candles.length - 1];


  $("price").textContent =
    "$" +
    formatPrice(c.close) +
    " USDT";


  $("open").textContent =
    formatPrice(c.open);


  $("high").textContent =
    formatPrice(c.high);


  $("low").textContent =
    formatPrice(c.low);


  $("close").textContent =
    formatPrice(c.close);


  $("tf").textContent =
    timeframe.toUpperCase();


  $("count").textContent =
    candles.length;

}


/* =========================
   CHANGE TIMEFRAME
========================= */

async function changeTF(tf){

  timeframe = tf;

  candles = [];


  $("tf").textContent =
    tf.toUpperCase();


  await loadCandles();

  connect();

}


/* =========================
   RESTART
========================= */

async function restart(){

  if(socket){

    try{
      socket.close();
    }
    catch(e){}

  }


  clearTimeout(
    reconnectTimer
  );


  candles = [];


  await loadCandles();

  connect();

}


/* =========================
   CANVAS SIZE
========================= */

function resizeCanvas(){

  const box =
    canvas.parentElement;


  const dpr =
    window.devicePixelRatio || 1;


  canvas.width =
    box.clientWidth * dpr;


  canvas.height =
    box.clientHeight * dpr;


  canvas.style.width =
    box.clientWidth + "px";


  canvas.style.height =
    box.clientHeight + "px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  draw();

}


window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================
   DRAW CANDLES
========================= */

function draw(){

  if(candles.length < 2)
    return;


  const W =
    canvas.parentElement.clientWidth;


  const H =
    canvas.parentElement.clientHeight;


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    Last 60 candles
  */

  const data =
    candles.slice(-60);


  let min =
    Math.min(
      ...data.map(
        c => c.low
      )
    );


  let max =
    Math.max(
      ...data.map(
        c => c.high
      )
    );


  const padding = 25;

  const range =
    Math.max(
      1,
      max - min
    );


  function Y(value){

    return padding +
      (
        (max - value) /
        range
      ) *
      (
        H - padding * 2
      );

  }


  const step =
    W / data.length;


  const bodyWidth =
    Math.max(
      2,
      step * 0.65
    );


  /*
    GRID
  */

  ctx.strokeStyle =
    "#1a2a3e";

  ctx.lineWidth = 1;


  for(let i=1;i<5;i++){

    const y =
      padding +
      (H-padding*2) *
      i / 5;


    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      W,
      y
    );

    ctx.stroke();

  }


  /*
    CANDLES
  */

  data.forEach(
    function(c,i){

      const x =
        i * step +
        step / 2;


      const openY =
        Y(c.open);


      const closeY =
        Y(c.close);


      const highY =
        Y(c.high);


      const lowY =
        Y(c.low);


      const bullish =
        c.close >= c.open;


      if(bullish){

        ctx.strokeStyle =
          "#00d084";

        ctx.fillStyle =
          "#00d084";

      }
      else{

        ctx.strokeStyle =
          "#ff526d";

        ctx.fillStyle =
          "#ff526d";

      }


      /*
        Wick
      */

      ctx.beginPath();

      ctx.moveTo(
        x,
        highY
      );

      ctx.lineTo(
        x,
        lowY
      );

      ctx.stroke();


      /*
        Candle body
      */

      ctx.fillRect(

        x - bodyWidth/2,

        Math.min(
          openY,
          closeY
        ),

        bodyWidth,

        Math.max(
          1,
          Math.abs(
            closeY - openY
          )
        )

      );

    }
  );


  /*
    LIVE PRICE LINE
  */

  const live =
    candles[
      candles.length-1
    ].close;


  const liveY =
    Y(live);


  ctx.strokeStyle =
    "#ffd54a";


  ctx.setLineDash(
    [5,5]
  );


  ctx.beginPath();

  ctx.moveTo(
    0,
    liveY
  );

  ctx.lineTo(
    W,
    liveY
  );

  ctx.stroke();


  ctx.setLineDash([]);


  /*
    LIVE PRICE TEXT
  */

  ctx.fillStyle =
    "#ffd54a";


  ctx.font =
    "bold 12px Arial";


  ctx.fillText(

    "$" +
    formatPrice(live),

    5,

    Math.max(
      15,
      liveY - 5
    )

  );

}


/* =========================
   START
========================= */

(async function(){

  await loadCandles();

  resizeCanvas();

  connect();

})();


/* =========================
   REDRAW EVERY SECOND
========================= */

setInterval(
  function(){

    draw();

  },
  1000
);

</script>

</body>
    </html>
