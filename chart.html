<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Trading Chart</title>

    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR */
        .topbar {
            height: 52px;
            min-height: 52px;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 6px 10px;

            background: #111820;
            border-bottom: 1px solid #27323d;

            overflow-x: auto;
            scrollbar-width: none;
        }

        .topbar::-webkit-scrollbar {
            display: none;
        }

        .symbol {
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            margin-right: 5px;
        }

        .timeframes {
            display: flex;
            gap: 5px;
        }

        .timeframes button {
            border: 1px solid #344250;

            background: #18212b;
            color: #dce3e8;

            border-radius: 5px;

            padding: 7px 10px;

            font-size: 13px;

            white-space: nowrap;
            cursor: pointer;
        }

        .timeframes button:hover {
            background: #263442;
        }

        .timeframes button.active {
            background: #2f7df6;
            color: white;
            border-color: #2f7df6;
        }

        /* CHART */
        #chart {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        /* BOTTOM BAR */
        .bottom {
            height: 30px;
            min-height: 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 10px;

            background: #111820;

            border-top: 1px solid #27323d;

            font-size: 12px;
        }

        #connection {
            color: #00d084;
        }

        #price {
            color: #dce3e8;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .topbar {
                height: 48px;
                min-height: 48px;
            }

            .symbol {
                font-size: 14px;
            }

            .timeframes button {
                padding: 6px 8px;
                font-size: 12px;
            }

            .bottom {
                height: 28px;
                min-height: 28px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         CHART HEADER
    ========================== -->

    <div class="topbar">

        <div class="symbol">
            BTC/USDT
        </div>

        <div class="timeframes">

            <button data-tf="1m">
                1m
            </button>

            <button data-tf="3m">
                3m
            </button>

            <button data-tf="5m"
                    class="active">
                5m
            </button>

            <button data-tf="15m">
                15m
            </button>

            <button data-tf="30m">
                30m
            </button>

            <button data-tf="1h">
                1H
            </button>

            <button data-tf="4h">
                4H
            </button>

            <button data-tf="1d">
                1D
            </button>

        </div>

    </div>


    <!-- =========================
         FULL CHART
    ========================== -->

    <div id="chart"></div>


    <!-- =========================
         STATUS BAR
    ========================== -->

    <div class="bottom">

        <span id="connection">
            Connecting...
        </span>

        <span id="price">
            Price: --
        </span>

    </div>


<script>

/* =========================================
   CHART CREATE
========================================= */

const chartElement =
    document.getElementById("chart");


const chart =
    LightweightCharts.createChart(
        chartElement,
        {

            layout: {

                background: {
                    color: "#0b0f14"
                },

                textColor: "#b8c2cc"

            },

            grid: {

                vertLines: {
                    color: "#18212b"
                },

                horzLines: {
                    color: "#18212b"
                }

            },

            crosshair: {

                mode:
                    LightweightCharts
                    .CrosshairMode
                    .Normal

            },

            rightPriceScale: {

                borderColor: "#344250"

            },

            timeScale: {

                borderColor: "#344250",

                timeVisible: true,

                secondsVisible: false,

                rightOffset: 8,

                barSpacing: 8,

                minBarSpacing: 2

            },

            handleScroll: {

                mouseWheel: true,

                pressedMouseMove: true,

                horzTouchDrag: true,

                vertTouchDrag: true

            },

            handleScale: {

                mouseWheel: true,

                pinch: true,

                axisPressedMouseMove: true

            }

        }
    );


/* =========================================
   CANDLE SERIES
========================================= */

const candles =
    chart.addCandlestickSeries({

        upColor: "#00c176",

        downColor: "#ef4444",

        borderUpColor: "#00c176",

        borderDownColor: "#ef4444",

        wickUpColor: "#00c176",

        wickDownColor: "#ef4444"

    });


/* =========================================
   VARIABLES
========================================= */

let currentTimeframe = "5m";

let socket = null;


/* =========================================
   LOAD HISTORICAL CANDLES
========================================= */

async function loadHistory() {

    try {

        document
            .getElementById("connection")
            .textContent = "Loading...";


        const url =
            "https://api.binance.com/api/v3/klines" +
            "?symbol=BTCUSDT" +
            "&interval=" +
            currentTimeframe +
            "&limit=1000";


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "History loading failed"
            );

        }


        const data =
            await response.json();


        const formatted =
            data.map(candle => ({

                time:
                    Math.floor(
                        Number(candle[0]) / 1000
                    ),

                open:
                    Number(candle[1]),

                high:
                    Number(candle[2]),

                low:
                    Number(candle[3]),

                close:
                    Number(candle[4])

            }));


        candles.setData(formatted);


        chart
            .timeScale()
            .fitContent();


        if (formatted.length > 0) {

            const last =
                formatted[
                    formatted.length - 1
                ];

            document
                .getElementById("price")
                .textContent =
                    "Price: " +
                    last.close.toFixed(2);

        }


        document
            .getElementById("connection")
            .textContent = "LIVE";


    } catch (error) {

        console.error(error);

        document
            .getElementById("connection")
            .textContent =
                "Connection Error";

    }

}


/* =========================================
   LIVE BINANCE WEBSOCKET
========================================= */

function startLive() {

    /* पुराने connection को बंद करें */

    if (socket) {

        try {
            socket.close();
        } catch (e) {}

    }


    const stream =
        "btcusdt@kline_" +
        currentTimeframe;


    socket =
        new WebSocket(
            "wss://stream.binance.com:9443/ws/" +
            stream
        );


    /* CONNECTION OPEN */

    socket.onopen = function () {

        document
            .getElementById("connection")
            .textContent = "LIVE";

    };


    /* NEW CANDLE */

    socket.onmessage = function (event) {

        const data =
            JSON.parse(event.data);


        const k =
            data.k;


        const candle = {

            time:
                Math.floor(
                    Number(k.t) / 1000
                ),

            open:
                Number(k.o),

            high:
                Number(k.h),

            low:
                Number(k.l),

            close:
                Number(k.c)

        };


        /* Chart पर candle update */

        candles.update(candle);


        /* Live price */

        document
            .getElementById("price")
            .textContent =
                "Price: " +
                candle.close.toFixed(2);

    };


    /* ERROR */

    socket.onerror = function () {

        document
            .getElementById("connection")
            .textContent =
                "Connection Error";

    };


    /* DISCONNECT */

    socket.onclose = function () {

        document
            .getElementById("connection")
            .textContent =
                "Reconnecting...";


        setTimeout(
            startLive,
            3000
        );

    };

}


/* =========================================
   TIMEFRAME BUTTONS
========================================= */

document
    .querySelectorAll("[data-tf]")
    .forEach(function(button) {

        button.addEventListener(
            "click",
            async function() {

                const tf =
                    button.dataset.tf;


                /* Same timeframe हो तो कुछ नहीं */

                if (
                    tf === currentTimeframe
                ) {
                    return;
                }


                /* नया timeframe */

                currentTimeframe = tf;


                /* Active button */

                document
                    .querySelectorAll("[data-tf]")
                    .forEach(function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );


                /* पुराने candles हटाएँ */

                candles.setData([]);


                /* नया history */

                await loadHistory();


                /* नया live stream */

                startLive();

            }

        );

    });


/* =========================================
   RESPONSIVE CHART
========================================= */

function resizeChart() {

    chart.resize(

        chartElement.clientWidth,

        chartElement.clientHeight

    );

}


window.addEventListener(
    "resize",
    resizeChart
);


/* =========================================
   START APPLICATION
========================================= */

resizeChart();

loadHistory();

startLive();

</script>

</body>
  </html>
