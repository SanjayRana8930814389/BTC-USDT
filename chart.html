<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Trading Chart - File 1</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0b0f14;
    color:#ffffff;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}


/* =========================
   TOP BAR
========================= */

.topbar{

    height:52px;
    min-height:52px;

    display:flex;
    align-items:center;

    gap:10px;

    padding:6px 10px;

    background:#111820;

    border-bottom:1px solid #293542;

    overflow-x:auto;

    scrollbar-width:none;
}

.topbar::-webkit-scrollbar{
    display:none;
}


.logo{

    font-size:16px;

    font-weight:bold;

    white-space:nowrap;

    margin-right:5px;
}


/* =========================
   TIMEFRAME
========================= */

.tf{

    display:flex;

    gap:5px;
}


.tf button{

    border:1px solid #354351;

    background:#18212b;

    color:#dce3e8;

    border-radius:5px;

    padding:7px 10px;

    font-size:12px;

    cursor:pointer;

    white-space:nowrap;
}


.tf button.active{

    background:#2f7df6;

    border-color:#2f7df6;

    color:#ffffff;
}


.tf button:active{

    transform:scale(.96);

}


/* =========================
   CHART AREA
========================= */

#chart{

    position:relative;

    flex:1;

    min-height:0;

    width:100%;

    background:#0b0f14;

}


/* =========================
   CANVAS
========================= */

canvas{

    display:block;

    width:100%;

    height:100%;

    touch-action:none;

}


/* =========================
   PRICE
========================= */

.priceBox{

    position:absolute;

    top:10px;

    right:10px;

    z-index:5;

    padding:7px 10px;

    border-radius:5px;

    background:rgba(17,24,32,.90);

    border:1px solid #354351;

    font-size:13px;

}


/* =========================
   STATUS
========================= */

.status{

    position:absolute;

    left:10px;

    top:10px;

    z-index:5;

    padding:6px 9px;

    border-radius:5px;

    background:rgba(17,24,32,.90);

    border:1px solid #354351;

    font-size:12px;

    color:#00d084;

}


/* =========================
   BOTTOM BAR
========================= */

.bottom{

    height:30px;

    min-height:30px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 10px;

    background:#111820;

    border-top:1px solid #293542;

    font-size:11px;

    color:#aeb8c2;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .topbar{

        height:48px;

        min-height:48px;

        padding:5px 7px;

    }


    .logo{

        font-size:14px;

    }


    .tf button{

        padding:6px 8px;

        font-size:11px;

    }


    .priceBox{

        top:8px;

        right:8px;

        font-size:11px;

    }


    .status{

        top:8px;

        left:8px;

        font-size:10px;

    }

}

</style>
</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">

    <div class="logo">
        BTC/USDT
    </div>


    <div class="tf">

        <button data-tf="1m">
            1m
        </button>

        <button data-tf="3m">
            3m
        </button>

        <button data-tf="5m"
                class="active">
            5m
        </button>

        <button data-tf="15m">
            15m
        </button>

        <button data-tf="30m">
            30m
        </button>

        <button data-tf="1h">
            1H
        </button>

        <button data-tf="4h">
            4H
        </button>

        <button data-tf="1d">
            1D
        </button>

    </div>

</div>


<!-- =========================
     CHART
========================= -->

<div id="chart">

    <canvas id="canvas"></canvas>


    <div id="status"
         class="status">
        Loading...
    </div>


    <div id="price"
         class="priceBox">
        Price: --
    </div>

</div>


<!-- =========================
     BOTTOM
========================= -->

<div class="bottom">

    <span>
        File No. 1
    </span>

    <span>
        Drag = Scroll | Pinch/Wheel = Zoom
    </span>

</div>



<script>

/* =========================================================
   BASIC SETTINGS
========================================================= */

const chartBox =
    document.getElementById("chart");


const canvas =
    document.getElementById("canvas");


const ctx =
    canvas.getContext("2d");


const statusBox =
    document.getElementById("status");


const priceBox =
    document.getElementById("price");


let timeframe = "5m";

let candles = [];

let socket = null;


/* =========================================================
   CHART VIEW
========================================================= */

let candleWidth = 9;

let candleGap = 3;

let offset = 0;

let dragStartX = 0;

let oldOffset = 0;

let dragging = false;


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    const dpr =
        window.devicePixelRatio || 1;


    const width =
        chartBox.clientWidth;


    const height =
        chartBox.clientHeight;


    canvas.width =
        width * dpr;


    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    draw();

}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   LOAD BINANCE HISTORY
========================================================= */

async function loadHistory(){

    try{

        statusBox.innerText =
            "Loading...";


        const url =
            "https://api.binance.com/api/v3/klines" +
            "?symbol=BTCUSDT" +
            "&interval=" +
            timeframe +
            "&limit=500";


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "Unable to load data"
            );

        }


        const data =
            await response.json();


        candles =
            data.map(x => ({

                time:
                    Number(x[0]),

                open:
                    Number(x[1]),

                high:
                    Number(x[2]),

                low:
                    Number(x[3]),

                close:
                    Number(x[4])

            }));


        offset = 0;


        statusBox.innerText =
            "LIVE";


        if(candles.length){

            const last =
                candles[
                    candles.length - 1
                ];


            priceBox.innerText =
                "Price: " +
                last.close.toFixed(2);

        }


        draw();


    }catch(error){

        console.error(error);


        statusBox.innerText =
            "Connection Error";

    }

}


/* =========================================================
   WEBSOCKET
========================================================= */

function startLive(){

    if(socket){

        try{

            socket.close();

        }catch(e){}

    }


    const stream =
        "btcusdt@kline_" +
        timeframe;


    socket =
        new WebSocket(
            "wss://stream.binance.com:9443/ws/" +
            stream
        );


    socket.onopen = function(){

        statusBox.innerText =
            "LIVE";

    };


    socket.onmessage =
        function(event){

            const data =
                JSON.parse(
                    event.data
                );


            const k =
                data.k;


            const candle = {

                time:
                    Number(k.t),

                open:
                    Number(k.o),

                high:
                    Number(k.h),

                low:
                    Number(k.l),

                close:
                    Number(k.c)

            };


            if(
                candles.length &&
                candles[
                    candles.length - 1
                ].time === candle.time
            ){

                candles[
                    candles.length - 1
                ] = candle;

            }else{

                candles.push(candle);


                if(candles.length > 500){

                    candles.shift();

                }

            }


            priceBox.innerText =
                "Price: " +
                candle.close.toFixed(2);


            draw();

        };


    socket.onerror =
        function(){

            statusBox.innerText =
                "Connection Error";

        };


    socket.onclose =
        function(){

            statusBox.innerText =
                "Reconnecting...";


            setTimeout(
                startLive,
                3000
            );

        };

}


/* =========================================================
   DRAW CHART
========================================================= */

function draw(){

    const width =
        chartBox.clientWidth;


    const height =
        chartBox.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if(!candles.length)
        return;


    /*
       दिखाई देने वाले candles
    */

    const visibleCount =
        Math.ceil(
            width /
            (candleWidth + candleGap)
        ) + 10;


    let end =
        candles.length -
        Math.floor(offset);


    if(end > candles.length)
        end = candles.length;


    if(end < 1)
        end = 1;


    let start =
        end - visibleCount;


    if(start < 0)
        start = 0;


    const visible =
        candles.slice(
            start,
            end
        );


    if(!visible.length)
        return;


    /* PRICE RANGE */

    let highest =
        -Infinity;

    let lowest =
        Infinity;


    visible.forEach(c => {

        if(c.high > highest)
            highest = c.high;

        if(c.low < lowest)
            lowest = c.low;

    });


    const range =
        highest - lowest || 1;


    const padding =
        range * 0.08;


    highest += padding;

    lowest -= padding;


    /* GRID */

    drawGrid(
        width,
        height,
        highest,
        lowest
    );


    /* CANDLES */

    visible.forEach(
        (c,index) => {

            const x =
                index *
                (candleWidth + candleGap)
                + 20;


            drawCandle(
                c,
                x,
                height,
                highest,
                lowest
            );

        }
    );


    /* PRICE LINE */

    const last =
        candles[
            candles.length - 1
        ];


    drawPriceLine(
        last.close,
        width,
        height,
        highest,
        lowest
    );


    /* RIGHT PRICE SCALE */

    drawPriceScale(
        width,
        height,
        highest,
        lowest
    );


    /* TIME SCALE */

    drawTimeScale(
        visible,
        width,
        height
    );

}


/* =========================================================
   GRID
========================================================= */

function drawGrid(
    width,
    height,
    high,
    low
){

    ctx.strokeStyle =
        "#18212b";

    ctx.lineWidth = 1;


    const rows = 8;


    for(let i=0;i<=rows;i++){

        const y =
            i *
            height /
            rows;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    const cols = 10;


    for(let i=0;i<=cols;i++){

        const x =
            i *
            width /
            cols;


        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            height
        );

        ctx.stroke();

    }

}


/* =========================================================
   CANDLE
========================================================= */

function drawCandle(
    c,
    x,
    height,
    high,
    low
){

    const chartHeight =
        height - 35;


    function priceY(price){

        return 5 +
            (
                high - price
            ) /
            (
                high - low
            ) *
            chartHeight;

    }


    const yHigh =
        priceY(c.high);


    const yLow =
        priceY(c.low);


    const yOpen =
        priceY(c.open);


    const yClose =
        priceY(c.close);


    const green =
        c.close >= c.open;


    ctx.strokeStyle =
        green
        ? "#00c176"
        : "#ef4444";


    ctx.fillStyle =
        green
        ? "#00c176"
        : "#ef4444";


    /* WICK */

    ctx.beginPath();

    ctx.moveTo(
        x + candleWidth / 2,
        yHigh
    );

    ctx.lineTo(
        x + candleWidth / 2,
        yLow
    );

    ctx.stroke();


    /* BODY */

    const bodyTop =
        Math.min(
            yOpen,
            yClose
        );


    const bodyHeight =
        Math.max(
            Math.abs(
                yClose - yOpen
            ),
            1
        );


    ctx.fillRect(
        x,
        bodyTop,
        candleWidth,
        bodyHeight
    );

}


/* =========================================================
   PRICE LINE
========================================================= */

function drawPriceLine(
    price,
    width,
    height,
    high,
    low
){

    const y =
        5 +
        (
            high - price
        ) /
        (
            high - low
        ) *
        (
            height - 35
        );


    ctx.strokeStyle =
        "#75808b";

    ctx.setLineDash([
        4,
        4
    ]);


    ctx.beginPath();

    ctx.moveTo(
        0,
        y
    );

    ctx.lineTo(
        width,
        y
    );

    ctx.stroke();


    ctx.setLineDash([]);

}


/* =========================================================
   PRICE SCALE
========================================================= */

function drawPriceScale(
    width,
    height,
    high,
    low
){

    ctx.fillStyle =
        "#9ca7b1";

    ctx.font =
        "11px Arial";


    const rows = 8;


    for(let i=0;i<=rows;i++){

        const price =
            high -
            (
                high-low
            ) *
            i /
            rows;


        const y =
            5 +
            (
                i *
                (
                    height-35
                ) /
                rows
            );


        ctx.fillText(
            price.toFixed(2),
            width - 70,
            y + 4
        );

    }

}


/* =========================================================
   TIME SCALE
========================================================= */

function drawTimeScale(
    visible,
    width,
    height
){

    if(!visible.length)
        return;


    ctx.fillStyle =
        "#89939e";

    ctx.font =
        "10px Arial";


    const step =
        Math.max(
            1,
            Math.floor(
                visible.length / 6
            )
        );


    visible.forEach(
        (c,index) => {

            if(
                index % step !== 0
            )
                return;


            const x =
                index *
                (
                    candleWidth +
                    candleGap
                ) +
                20;


            const date =
                new Date(c.time);


            const text =
                date.toLocaleTimeString(
                    [],
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );


            ctx.fillText(
                text,
                x,
                height - 8
            );

        }
    );

}


/* =========================================================
   MOUSE DRAG
========================================================= */

canvas.addEventListener(
    "mousedown",
    function(e){

        dragging = true;

        dragStartX =
            e.clientX;

        oldOffset =
            offset;

    }
);


window.addEventListener(
    "mouseup",
    function(){

        dragging = false;

    }
);


window.addEventListener(
    "mousemove",
    function(e){

        if(!dragging)
            return;


        const dx =
            e.clientX -
            dragStartX;


        const move =
            dx /
            (
                candleWidth +
                candleGap
            );


        offset =
            oldOffset -
            move;


        offset =
            Math.max(
                0,
                Math.min(
                    candles.length - 10,
                    offset
                )
            );


        draw();

    }
);


/* =========================================================
   TOUCH DRAG
========================================================= */

let touchStartX = 0;

let touchOldOffset = 0;


canvas.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length !== 1
        )
            return;


        touchStartX =
            e.touches[0].clientX;


        touchOldOffset =
            offset;

    },
    {
        passive:true
    }
);


canvas.addEventListener(
    "touchmove",
    function(e){

        if(
            e.touches.length !== 1
        )
            return;


        const dx =
            e.touches[0].clientX -
            touchStartX;


        const move =
            dx /
            (
                candleWidth +
                candleGap
            );


        offset =
            touchOldOffset -
            move;


        offset =
            Math.max(
                0,
                Math.min(
                    candles.length - 10,
                    offset
                )
            );


        draw();

    },
    {
        passive:true
    }
);


/* =========================================================
   MOUSE WHEEL ZOOM
========================================================= */

canvas.addEventListener(
    "wheel",
    function(e){

        e.preventDefault();


        if(e.deltaY < 0){

            candleWidth =
                Math.min(
                    30,
                    candleWidth + 1
                );

        }else{

            candleWidth =
                Math.max(
                    3,
                    candleWidth - 1
                );

        }


        draw();

    },
    {
        passive:false
    }
);


/* =========================================================
   TIMEFRAME
========================================================= */

document
.querySelectorAll("[data-tf]")
.forEach(
    function(button){

        button.addEventListener(
            "click",
            async function(){

                const tf =
                    button.dataset.tf;


                if(
                    tf === timeframe
                )
                    return;


                timeframe = tf;


                document
                .querySelectorAll(
                    "[data-tf]"
                )
                .forEach(
                    function(b){

                        b.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );
